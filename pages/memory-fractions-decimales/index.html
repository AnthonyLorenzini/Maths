<meta charset="utf-8">

<title>Le Mémory des Fractions décimales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Base commune Leçon 4 — titres condensés, texte Work Sans, nombres Space Mono ; ambre = action, vert = juste, rouge = faux */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --paper:#ffffff; --ink:#221d12; --muted:#6d6656; --line:#cfc8b6; --grid:#ddd6c4;
  --amber:#e8a400; --amber-ink:#8a5d00; --fill:#f5b81c; --fill-2:#fbe3a1; --on-amber:#1b1404;
  --ok:#1f9a55; --ok-bg:#e3f5ea; --ko:#d23c3c; --ko-bg:#fbe7e7;
  --blue:#2463d6; --blue-bg:#e6eefc; --magenta:#c0287f; --magenta-bg:#fbe6f2; --teal:#0e8f88; --teal-bg:#dff4f2;
  --f-title:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-text:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Space Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16140f; --panel:#201d16; --paper:#2a261d; --ink:#f3eddf; --muted:#aaa18c; --line:#4a4334; --grid:#3d3729;
  --amber:#f2b52a; --amber-ink:#f6c95a; --fill:#e9a90f; --fill-2:#5a4515; --on-amber:#1b1404;
  --ok:#3fcf7d; --ok-bg:#163524; --ko:#ff6b6b; --ko-bg:#3d1a1a;
  --blue:#6c9cff; --blue-bg:#1a2742; --magenta:#f06bc0; --magenta-bg:#3a1830; --teal:#3fd6cc; --teal-bg:#123634; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140f; --panel:#201d16; --paper:#2a261d; --ink:#f3eddf; --muted:#aaa18c; --line:#4a4334; --grid:#3d3729;
  --amber:#f2b52a; --amber-ink:#f6c95a; --fill:#e9a90f; --fill-2:#5a4515; --on-amber:#1b1404;
  --ok:#3fcf7d; --ok-bg:#163524; --ko:#ff6b6b; --ko-bg:#3d1a1a;
  --blue:#6c9cff; --blue-bg:#1a2742; --magenta:#f06bc0; --magenta-bg:#3a1830; --teal:#3fd6cc; --teal-bg:#123634; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-text);padding-inline:16px;padding-block:16px 40px;margin:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(2.1rem,7vw,3.5rem)/.9 var(--f-title);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--amber)}
h2{font:800 clamp(1.4rem,4.5vw,2rem)/1.05 var(--f-title);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:70ch}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{font:700 1.1rem var(--f-title);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--amber)}
@media (max-width:440px){.tabs button{padding:8px 8px;font-size:1rem}}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{font:600 .9rem var(--f-text);background:none;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:600 .95rem var(--f-text);border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--amber)}
.btn.main{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.recit{margin:0;padding:12px 16px;background:var(--panel);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;max-width:75ch}
.num{font-family:var(--f-num);font-weight:700}
.fr{display:inline-flex;flex-direction:column;align-items:center;font:700 1em var(--f-num);line-height:1.05;vertical-align:middle}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}
.msg{min-height:1.5em;font-weight:600;margin:0}
.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
input.ans{font:700 1.25rem var(--f-num);text-align:center;border:2px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:6px 4px;width:6em;max-width:100%}
input.ans:focus{outline:none;border-color:var(--amber)}
input.ans.ok{border-color:var(--ok);background:var(--ok-bg)}
input.ans.ko{border-color:var(--ko);background:var(--ko-bg)}
.lvl{font:600 .85rem var(--f-text);color:var(--muted)}
/* équipes */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.teams{grid-template-columns:minmax(0,1fr)}}
.team{border:2px solid var(--tc);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.team.t0{--tc:var(--blue);--tb:var(--blue-bg)}.team.t1{--tc:var(--magenta);--tb:var(--magenta-bg)}.team.t2{--tc:var(--teal);--tb:var(--teal-bg)}
.team .th{background:var(--tb);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.team .tn{font:800 1.3rem var(--f-title);text-transform:uppercase;letter-spacing:.05em;color:var(--tc)}
.team .ts{font:700 1.5rem var(--f-num);color:var(--tc)}
.team .tb{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.team .draw{display:flex;align-items:center;gap:10px}
.team .draw button{font:600 .85rem var(--f-text);border:2px solid var(--tc);color:var(--tc);background:none;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px}
.team .who{font:700 1.4rem var(--f-num);color:var(--tc);min-width:2ch}
.team.turn{box-shadow:0 0 0 4px var(--tc)}
.team.win{animation:pop .5s}
.team .res{font-weight:600;min-height:1.4em}
.team .res.ok{color:var(--ok)}.team .res.ko{color:var(--ko)}
@keyframes pop{50%{transform:scale(1.04)}}
.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.settings input{width:4em;font:700 .95rem var(--f-num);border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:3px 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.team .slot:empty,.team .res:empty{display:none}
.teams.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.teams.compact .th{flex-direction:column;align-items:flex-start;gap:0;padding:6px 10px}
.teams.compact .tn{font-size:1.05rem}
.teams.compact .ts{font-size:1.3rem}
.teams.compact .tb{padding:6px 10px}
.teams.compact .draw{flex-wrap:wrap;gap:4px 8px}
.teams.compact .draw button{padding:4px 8px;min-height:32px;font-size:.8rem}
.teams.compact .who{font-size:1.1rem}
@media (max-width:420px){.teams.compact .tn{font-size:.9rem;letter-spacing:.02em}}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.grp{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:100%}
</style>
<script>
window.L4=(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* nombre en écriture française, sans zéros inutiles (dp = nb max de décimales) */
const fmt=(x,dp=3)=>{let s=(Math.round(x*10**dp)/10**dp).toFixed(dp);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');const [a,b]=s.split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(b?','+b:'');};
const fmt2=x=>(Math.round(x*100)/100).toFixed(2).replace('.',',');
/* lecture d'une réponse : "3,5" "3.5" "35/100" "35 %" "1 + 3/10" ; NaN si illisible */
function parse(v){
  if(v==null)return NaN;v=String(v).trim().replace(/\s+/g,'').replace(/%$/,'');
  if(!v)return NaN;
  if(v.includes('+'))return v.split('+').reduce((s,p)=>s+parse(p),0);
  const m=v.match(/^(\d+(?:[.,]\d+)?)\/(\d+(?:[.,]\d+)?)$/);
  if(m){const d=+m[2].replace(',','.');return d?(+m[1].replace(',','.'))/d:NaN;}
  if(!/^-?\d+(?:[.,]\d+)?$/.test(v)&&!/^-?[.,]\d+$/.test(v))return NaN;
  return +v.replace(',','.');
}
const same=(a,b)=>Math.abs(a-b)<1e-9;
const store={get(k,d){try{const v=localStorage.getItem('l4.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem('l4.'+k,JSON.stringify(v));}catch(e){}}};
/* onglets simples : <nav class="tabs"><button data-tab="x"> + éléments [data-pane="x"] */
function tabs(nav,onChange){
  nav.setAttribute('role','tablist');
  const go=t=>{$$('[data-tab]',nav).forEach(b=>{b.setAttribute('role','tab');b.setAttribute('aria-selected',b.dataset.tab===t);});
    $$('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==t);onChange&&onChange(t);};
  nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});
  return go;
}
/* contrôle segmenté : boutons [data-v] */
function seg(el,onChange,init){
  const set=v=>{$$('[data-v]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));onChange&&onChange(v);};
  el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)set(b.dataset.v);});
  if(init!=null)set(init);return set;
}
/* ---- trois équipes : bleu, magenta, turquoise, tirage au sort d'un élève ---- */
const TEAMS=['Bleus','Magentas','Turquoises'];
function Teams(el,opt={}){
  let size=store.get('teamSize',9);
  const T=TEAMS.map((n,i)=>({i,name:n,score:0,pool:[],who:null}));
  let turn=null;
  el.classList.add('teams');if(opt.compact)el.classList.add('compact');
  el.innerHTML=T.map(t=>`<section class="team t${t.i}" data-team="${t.i}">
    <div class="th"><span class="tn">${t.name}</span><span class="ts" aria-label="score">0</span></div>
    <div class="tb"><div class="draw"><button type="button" data-drawbtn>${opt.compact?'Tirer':'Tirer un élève'}</button><span class="who" aria-live="polite"></span></div>
    <div class="slot"></div><div class="res" aria-live="polite"></div></div></section>`).join('');
  const box=i=>el.querySelector(`[data-team="${i}"]`);
  function refill(t){t.pool=shuffle(Array.from({length:size},(_,k)=>k+1));}
  function draw(i){
    const t=T[i];if(!t.pool.length)refill(t);
    const n=t.pool.pop(),w=box(i).querySelector('.who');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){w.textContent='n°'+n;return;}
    let k=0;const iv=setInterval(()=>{w.textContent='n°'+rnd(1,size);if(++k>9){clearInterval(iv);w.textContent='n°'+n;}},55);
  }
  el.addEventListener('click',e=>{const b=e.target.closest('[data-drawbtn]');if(b)draw(+b.closest('[data-team]').dataset.team);});
  const api={
    slot:i=>box(i).querySelector('.slot'),
    res(i,txt,ok){const r=box(i).querySelector('.res');r.textContent=txt||'';r.className='res'+(ok===true?' ok':ok===false?' ko':'');},
    add(i,p=1){T[i].score+=p;box(i).querySelector('.ts').textContent=T[i].score;if(p>0){const b=box(i);b.classList.remove('win');void b.offsetWidth;b.classList.add('win');}},
    setTurn(i){turn=i;T.forEach(t=>box(t.i).classList.toggle('turn',t.i===i));},
    nextTurn(){api.setTurn(turn==null?0:(turn+1)%3);return turn;},
    get turn(){return turn;},
    scores:()=>T.map(t=>t.score),
    reset(){T.forEach(t=>{t.score=0;box(t.i).querySelector('.ts').textContent=0;api.res(t.i,'');});},
    clearWho(){T.forEach(t=>box(t.i).querySelector('.who').textContent='');},
    name:i=>T[i].name,
    settings(container){
      container.innerHTML=`<label class="settings">Élèves par équipe <input type="number" id="teamsize" min="2" max="15" value="${size}"></label>`;
      container.querySelector('input').addEventListener('change',e=>{size=Math.max(2,Math.min(15,+e.target.value||9));store.set('teamSize',size);T.forEach(refill);});
    }
  };
  T.forEach(refill);
  return api;
}
/* petit carré dessiné en SVG : n parts coloriées sur u (10 = bandes, 100 = quadrillage), plusieurs carrés si besoin */
function squaresSVG(t,u,size=60){
  const n=Math.max(1,Math.ceil(t/u)),gap=6,W=n*size+(n-1)*gap;
  let s=`<svg viewBox="-1 -1 ${W+2} ${size+2}" width="${W+2}" height="${size+2}" role="img" aria-label="carré colorié">`;
  for(let k=0;k<n;k++){const x0=k*(size+gap);
    s+=`<rect x="${x0}" y="0" width="${size}" height="${size}" fill="var(--paper)"/>`;
    const c=size/10;
    for(let j=0;j<u;j++){const idx=k*u+j;if(idx>=t)break;
      if(u===10)s+=`<rect x="${x0}" y="${j*c}" width="${size}" height="${c}" fill="var(--fill)"/>`;
      else s+=`<rect x="${x0+(j%10)*c}" y="${Math.floor(j/10)*c}" width="${c}" height="${c}" fill="var(--fill)"/>`;}
    for(let j=1;j<10;j++){s+=`<line x1="${x0}" x2="${x0+size}" y1="${j*c}" y2="${j*c}" stroke="var(--grid)" stroke-width="1"/>`;
      if(u===100)s+=`<line y1="0" y2="${size}" x1="${x0+j*c}" x2="${x0+j*c}" stroke="var(--grid)" stroke-width="1"/>`;}
    s+=`<rect x="${x0}" y="0" width="${size}" height="${size}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;}
  return s+'</svg>';
}
return {$,$$,f,rnd,pick,shuffle,fmt,fmt2,parse,same,store,tabs,seg,Teams,squaresSVG};
})();
</script>
<style>
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:760px){.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.card{position:relative;aspect-ratio:4/3;max-width:100%;border:0;padding:0;background:none;cursor:pointer;perspective:800px;font:inherit;color:inherit}
.card .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;overflow:hidden}
.back{background:var(--amber);color:var(--on-amber);font:800 2rem var(--f-title);background-image:repeating-linear-gradient(0deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px),repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px)}
.front{background:var(--paper);border:2px solid var(--line);transform:rotateY(180deg)}
.front .k{font:600 .62rem var(--f-text);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.front .v{font:700 clamp(.95rem,2.6vw,1.45rem) var(--f-num);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.25em;text-align:center}
.front .w{font:600 clamp(.8rem,2.2vw,1.05rem) var(--f-text);text-align:center;line-height:1.2}
.front svg{max-width:100%;max-height:calc(100% - 20px);width:auto;height:auto}
.card.found .front{border-color:var(--fc,var(--ok));box-shadow:inset 0 0 0 2px var(--fc,var(--ok))}
.card.bad .front{border-color:var(--ko)}
.card.found{cursor:default}
.f0{--fc:var(--blue)}.f1{--fc:var(--magenta)}.f2{--fc:var(--teal)}
.status{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-weight:600}
.status .num{font-size:1.2rem}
</style>
<div class="wrap">
  <header class="top">
    <div><h1>Le Mémory des <span>fractions décimales</span></h1>
    <p class="sub">Retrouve les trois cartes qui montrent le même nombre : la fraction, le dessin et l'autre écriture. Une erreur et les cartes se retournent.</p></div>
  </header>
  <div class="row">
    <span class="grp"><span class="lvl">Niveau</span>
    <div class="seg" id="level"><button data-v="1">Dixièmes</button><button data-v="2">Centièmes et virgule</button><button data-v="3">Millièmes, sans dessin</button></div></span>
  </div>
  <div class="row">
    <span class="grp"><span class="lvl">Jeu</span>
    <div class="seg" id="mode"><button data-v="classe">Classe : 3 équipes</button><button data-v="solo">Solo</button></div></span>
    <button class="btn main" id="new">Nouvelle partie</button>
  </div>
  <div id="teams"></div>
  <div class="status" id="solo"><span>Coups : <span class="num" id="coups">0</span></span><span>Temps : <span class="num" id="time">0 s</span></span><span id="best" class="hint"></span></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="board" id="board"></div>
  <div id="set"></div>
</div>
<script>
(function(){
const {$,$$,f,shuffle,seg,store,Teams,squaresSVG,fmt}=L4;
const plus='<span>+</span>';
/* chaque nombre donne 3 cartes */
function card1(t){ /* t dixièmes */
  const a=Math.floor(t/10),b=t%10;
  const mix=t<10?`<span class="w">${b} ${b>1?'dixièmes':'dixième'}</span>`:b===0?`<span class="w">${a} ${a>1?'carrés':'carré'}</span>`:`<span class="w">${a} ${a>1?'carrés':'carré'} + ${b} ${b>1?'dixièmes':'dixième'}</span>`;
  return [{k:'Fraction',h:`<span class="v">${f(t,10)}</span>`},{k:'Dessin',h:squaresSVG(t,10,80)},{k:'En mots',h:mix}];
}
function card2(t){ /* t centièmes */
  return [{k:'Fraction',h:`<span class="v">${f(t,100)}</span>`},{k:'Dessin',h:squaresSVG(t,100,90)},{k:'Écriture décimale',h:`<span class="v">${fmt(t/100)}</span>`}];
}
function card3(t){ /* t millièmes */
  const a=Math.floor(t/1000),r=t%1000,d=Math.floor(r/100),c=Math.floor(r/10)%10,m=r%10;
  const parts=[];if(a)parts.push(`<span>${a}</span>`);if(d)parts.push(f(d,10));if(c)parts.push(f(c,100));if(m)parts.push(f(m,1000));
  let den=1000,num=t;while(num%10===0&&den>10){num/=10;den/=10;}
  return [{k:'Fraction',h:`<span class="v">${f(num,den)}</span>`},{k:'Somme',h:`<span class="v">${parts.join(plus)}</span>`},{k:'Écriture décimale',h:`<span class="v">${fmt(t/1000)}</span>`}];
}
/* paires de nombres faciles à confondre : on tire des paires entières */
const POOLS={
 1:{make:card1,pairs:[[3,30],[13,3],[7,17],[12,21],[24,4],[29,9],[10,1],[18,8],[15,5]]},
 2:{make:card2,pairs:[[25,52],[4,40],[105,150],[37,73],[7,70],[99,9],[20,2],[110,101],[64,46]]},
 3:{make:card3,pairs:[[4107,4170],[3070,3700],[35,350],[2508,2580],[1205,1250],[6009,6090],[750,75],[8040,8400]]}
};
let level=+store.get('memLevel',1),mode=store.get('memMode','classe');
let cards=[],up=[],lock=false,found=0,total=0,coups=0,t0=0,tick=null;
const teams=Teams($('#teams'),{compact:true});teams.settings($('#set'));
function deal(){
  const P=POOLS[level];const pairs=shuffle(P.pairs).slice(0,3);
  const nums=pairs.flat();total=nums.length;
  cards=shuffle(nums.flatMap(t=>P.make(t).map(c=>({...c,key:t}))));
  up=[];lock=false;found=0;coups=0;clearInterval(tick);t0=0;$('#coups').textContent=0;$('#time').textContent='0 s';
  $('#board').innerHTML=cards.map((c,i)=>`<button class="card" data-i="${i}" aria-label="carte ${i+1}"><span class="in"><span class="face back">?</span><span class="face front"><span class="k">${c.k}</span>${c.h}</span></span></button>`).join('');
  teams.reset();teams.clearWho();
  if(mode==='classe'){teams.setTurn(0);say(`À vous, ${teams.name(0)} ! Retournez trois cartes.`);}else{teams.setTurn(null);say('Retourne trois cartes qui vont ensemble.');}
  const b=store.get('memBest'+level,null);$('#best').textContent=b?`Record : ${b.c} coups, ${b.s} s`:'';
}
function say(t,c){const m=$('#msg');m.textContent=t;m.className='msg'+(c?' '+c:'');}
$('#board').addEventListener('click',e=>{
  const el=e.target.closest('.card');if(!el||lock||el.classList.contains('up'))return;
  if(mode==='solo'&&!t0){t0=Date.now();tick=setInterval(()=>$('#time').textContent=Math.round((Date.now()-t0)/1000)+' s',500);}
  el.classList.add('up');up.push(+el.dataset.i);
  const keys=up.map(i=>cards[i].key);
  if(keys.some(k=>k!==keys[0])){
    lock=true;coups++;$('#coups').textContent=coups;
    up.forEach(i=>$(`.card[data-i="${i}"]`).classList.add('bad'));
    if(mode==='classe'){say(`Raté ! Ces cartes ne montrent pas le même nombre.`,'ko');}
    else say('Raté, ces cartes ne vont pas ensemble.','ko');
    setTimeout(()=>{up.forEach(i=>{const c=$(`.card[data-i="${i}"]`);c.classList.remove('up','bad');});up=[];lock=false;
      if(mode==='classe'){const n=teams.nextTurn();say(`À vous, ${teams.name(n)} !`);}},1300);
    return;
  }
  if(up.length===3){
    coups++;$('#coups').textContent=coups;found++;
    const cls=mode==='classe'?' f'+teams.turn:'';
    up.forEach(i=>{const c=$(`.card[data-i="${i}"]`);c.classList.add('found');if(cls)c.classList.add(cls.trim());});
    up=[];
    if(mode==='classe'){teams.add(teams.turn,1);say(`Bravo, ${teams.name(teams.turn)} ! Un trio de plus. Vous rejouez.`,'ok');}
    else say('Bravo, un trio !','ok');
    if(found===total)end();
  }
});
function end(){
  clearInterval(tick);
  if(mode==='classe'){const sc=teams.scores(),mx=Math.max(...sc),w=sc.map((s,i)=>s===mx?teams.name(i):null).filter(Boolean);
    say(w.length>1?`Égalité entre ${w.join(' et ')} !`:`Victoire des ${w[0]} avec ${mx} trios !`,'ok');}
  else{const s=Math.round((Date.now()-t0)/1000);const b=store.get('memBest'+level,null);
    if(!b||coups<b.c||(coups===b.c&&s<b.s)){store.set('memBest'+level,{c:coups,s});say(`Nouveau record : ${coups} coups en ${s} s !`,'ok');}
    else say(`Terminé en ${coups} coups et ${s} s.`,'ok');}
}
seg($('#level'),v=>{level=+v;store.set('memLevel',level);deal();},level);
seg($('#mode'),v=>{mode=v;store.set('memMode',mode);$('#teams').hidden=mode!=='classe';$('#set').hidden=mode!=='classe';$('#solo').hidden=mode!=='solo';deal();},mode);
$('#new').addEventListener('click',deal);
})();
</script>
