<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Cercle et ses noms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EFEAE0;--card:#fff;--ink:#22303F;--muted:#6B7A8A;--line:#D8DEE4;--vert:#0F9562;--vert-bg:#DDF6EA;--rouge:#C0392B;--rouge-bg:#FBE7E7;--bleu:#2B6CB0;--bleu-bg:#E6EEFC;--ambre:#E8700F;--ambre-bg:#FFEBD9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Work Sans',Arial,sans-serif;padding:16px 12px 90px}
.wrap{max-width:760px;margin:0 auto}
h1{font:700 clamp(1.7rem,6vw,2.4rem)/1.1 'Baloo 2',sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(34,48,63,.10);margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pill{font:700 .9rem 'Baloo 2',sans-serif;background:var(--bleu-bg);color:var(--bleu);border-radius:999px;padding:3px 12px}
.q{font-weight:600;font-size:1.05rem;margin:6px 0 10px}
.btn{font:700 1rem 'Baloo 2',sans-serif;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;min-height:44px}
.btn:hover{background:#F4F1EA}
.btn.main{background:var(--vert);border-color:var(--vert);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.choix .btn.ok{background:var(--vert-bg);border-color:var(--vert);color:var(--vert)}
.choix .btn.ko{background:var(--rouge-bg);border-color:var(--rouge);color:var(--rouge)}
input[type=text]{font:700 1.2rem 'Work Sans',sans-serif;width:150px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px}
.msg{min-height:1.6em;font-weight:600;margin:8px 0 4px}
.msg.ok{color:var(--vert)}.msg.ko{color:var(--rouge)}
.schema{text-align:center}.schema svg{max-width:100%;height:auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.fin{text-align:center}.fin .gros{font:700 2.4rem 'Baloo 2',sans-serif;color:var(--vert)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
<h1>Le Cercle et ses noms</h1>
<p class="sub">Rayon, diamètre ou corde ? 8 questions, avec de nouvelles figures à chaque série.</p>
<div class="card" id="jeu"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const F=x=>String(Math.round(x*100)/100).replace('.',',');
const num=s=>parseFloat(String(s).trim().replace(/\s/g,'').replace(',','.'));
const NS='http://www.w3.org/2000/svg';
function fin(score,total,again){
  const m=score===total?'Parfait !':score>=total*0.75?'Très bien !':score>=total/2?'Bien, continue de t\'entraîner.':'Relis la méthode et recommence.';
  $('#jeu').innerHTML='<div class="fin"><div class="gros">'+score+' / '+total+'</div><p>'+m+'</p><button class="btn main" id="again">Nouvelle série</button></div>';
  $('#again').onclick=again;
}

const TOTAL=8;let n,score,cur;
const LETTRES='ABCDEFGHIJKLMNPQRSTUV'.split('');
const VF=[
 ['Un diamètre est une corde.',true],['Un rayon relie deux points du cercle.',false],['Le centre appartient au cercle.',false],
 ['Le centre appartient au disque.',true],['Tous les rayons d\'un cercle ont la même longueur.',true],['Une corde est toujours plus courte que le diamètre ou égale à lui.',true],
 ['Le diamètre est la moitié du rayon.',false],['Le disque est formé du cercle et de son intérieur.',true],['Un diamètre passe par le centre du cercle.',true],['Un cercle a un seul diamètre.',false]
];
function figure(type,A,B){
  const cx=120,cy=100,r=80,O=[cx,cy];
  const p=d=>[cx+r*Math.cos(d*Math.PI/180),cy-r*Math.sin(d*Math.PI/180)];
  let a=rnd(0,359),P=p(a),Q;
  if(type==='diam')Q=p(a+180);else if(type==='corde')Q=p(a+rnd(60,140)*(Math.random()<.5?1:-1));else Q=O;
  const lab=(pt,t,from)=>{const dx=pt[0]-cx,dy=pt[1]-cy,L=Math.hypot(dx,dy)||1;return `<text x="${pt[0]+dx/L*15}" y="${pt[1]+dy/L*15+5}" text-anchor="middle" font-weight="700" font-size="16" fill="#22303F">${t}</text>`};
  let s=`<svg viewBox="0 0 240 200" width="260"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2B6CB0" stroke-width="3"/>`;
  s+=`<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="#E8700F" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="#22303F"/><text x="${cx+12}" y="${cy+16}" font-weight="700" font-size="14" fill="#22303F">O</text>`;
  s+=`<circle cx="${P[0]}" cy="${P[1]}" r="3.5" fill="#22303F"/>`+lab(P,A);
  if(type!=='rayon'){s+=`<circle cx="${Q[0]}" cy="${Q[1]}" r="3.5" fill="#22303F"/>`+lab(Q,B);}
  else s=s.replace('</text><circle cx="'+P[0],'</text><circle cx="'+P[0]);
  return s+'</svg>';
}
function qNom(){
  const type=pick(['rayon','diam','corde']);const [x,y]=shuffle(LETTRES).slice(0,2);
  let ex,seg;
  if(type==='rayon'){seg='[O'+x+']';ex='Un rayon relie le centre à un point du cercle.'}
  else if(type==='diam'){seg='['+x+y+']';ex='Il passe par le centre O : c\'est un diamètre.'}
  else{seg='['+x+y+']';ex='Ses deux extrémités sont sur le cercle mais il ne passe pas par O : c\'est une corde.'}
  const rep={rayon:'Un rayon',diam:'Un diamètre',corde:'Une corde'}[type];
  return{html:`<div class="schema">${figure(type,x,y)}</div><div class="q">Comment s'appelle le segment orange ${seg} ?</div>`,
    choix:['Un rayon','Un diamètre','Une corde'],bon:rep,expl:ex};
}
function qDiam(){
  const v=pick([2,3,3.5,4,4.5,5,6,6.5,7,7.5,8,9,10,12,15]);
  if(Math.random()<.5)return{html:`<div class="q">Un cercle a un rayon de <b>${F(v)} cm</b>. Quel est son diamètre ?</div>`,saisie:true,bon:2*v,unite:'cm',expl:`Le diamètre est le double du rayon : 2 × ${F(v)} = ${F(2*v)} cm.`};
  return{html:`<div class="q">Un cercle a un diamètre de <b>${F(2*v)} cm</b>. Quel est son rayon ?</div>`,saisie:true,bon:v,unite:'cm',expl:`Le rayon est la moitié du diamètre : ${F(2*v)} ÷ 2 = ${F(v)} cm.`};
}
function qVF(){
  const [t,b]=pick(VF);
  return{html:`<div class="q">Vrai ou faux ?<br>« ${t} »</div>`,choix:['Vrai','Faux'],bon:b?'Vrai':'Faux',expl:b?'C\'est vrai.':'C\'est faux. Corrige : relis les définitions de la séance 1.'};
}
function gen(){const types=shuffle(['nom','nom','nom','diam','diam','vf','vf','nom']);return types.map(t=>t==='nom'?qNom():t==='diam'?qDiam():qVF())}
let Q;
function start(){Q=gen();n=0;score=0;show()}
function show(){
  cur=Q[n];let h=`<div class="top"><span class="pill">Question ${n+1} / ${TOTAL}</span><span class="pill">Score : ${score}</span></div>${cur.html}`;
  if(cur.choix)h+='<div class="choix">'+cur.choix.map(c=>`<button class="btn" data-c="${c}">${c}</button>`).join('')+'</div>';
  else h+=`<input type="text" id="rep" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"> <span>${cur.unite}</span> <button class="btn main" id="val">Valider</button>`;
  h+='<div class="msg" id="msg"></div><button class="btn main" id="suiv" hidden>Suite</button>';
  $('#jeu').innerHTML=h;
  if(cur.choix)document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>fin1(b.dataset.c===cur.bon,b));
  else{const go=()=>{const v=num($('#rep').value);if(isNaN(v))return;fin1(Math.abs(v-cur.bon)<1e-9)};$('#val').onclick=go;$('#rep').onkeydown=e=>{if(e.key==='Enter')go()};$('#rep').focus()}
  $('#suiv').onclick=()=>{n++;n<TOTAL?show():fin(score,TOTAL,start)};
}
function fin1(ok,btn){
  if(ok)score++;
  if(cur.choix){document.querySelectorAll('[data-c]').forEach(b=>{b.disabled=true;if(b.dataset.c===cur.bon)b.classList.add('ok');else if(b===btn)b.classList.add('ko')})}
  else{$('#rep').disabled=true;$('#val').disabled=true}
  $('#msg').className='msg '+(ok?'ok':'ko');$('#msg').textContent=(ok?'Juste ! ':'Pas tout à fait. ')+cur.expl;
  $('#suiv').hidden=false;$('#suiv').textContent=n+1<TOTAL?'Question suivante':'Voir mon score';$('#suiv').focus();
}
start();

</script>
<script src="../../assets/catalogue.js"></script>
<script src="../../assets/barre.js"></script>
</body>
</html>
