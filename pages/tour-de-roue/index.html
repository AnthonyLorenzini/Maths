<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Tour de roue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EFEAE0;--card:#fff;--ink:#22303F;--muted:#6B7A8A;--line:#D8DEE4;--vert:#0F9562;--vert-bg:#DDF6EA;--rouge:#C0392B;--rouge-bg:#FBE7E7;--bleu:#2B6CB0;--bleu-bg:#E6EEFC;--ambre:#E8700F;--ambre-bg:#FFEBD9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Work Sans',Arial,sans-serif;padding:16px 12px 90px}
.wrap{max-width:760px;margin:0 auto}
h1{font:700 clamp(1.7rem,6vw,2.4rem)/1.1 'Baloo 2',sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(34,48,63,.10);margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pill{font:700 .9rem 'Baloo 2',sans-serif;background:var(--bleu-bg);color:var(--bleu);border-radius:999px;padding:3px 12px}
.q{font-weight:600;font-size:1.05rem;margin:6px 0 10px}
.btn{font:700 1rem 'Baloo 2',sans-serif;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;min-height:44px}
.btn:hover{background:#F4F1EA}
.btn.main{background:var(--vert);border-color:var(--vert);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.choix .btn.ok{background:var(--vert-bg);border-color:var(--vert);color:var(--vert)}
.choix .btn.ko{background:var(--rouge-bg);border-color:var(--rouge);color:var(--rouge)}
input[type=text]{font:700 1.2rem 'Work Sans',sans-serif;width:150px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px}
.msg{min-height:1.6em;font-weight:600;margin:8px 0 4px}
.msg.ok{color:var(--vert)}.msg.ko{color:var(--rouge)}
.schema{text-align:center}.schema svg{max-width:100%;height:auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.fin{text-align:center}.fin .gros{font:700 2.4rem 'Baloo 2',sans-serif;color:var(--vert)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.mode .btn.on{background:var(--ink);color:#fff}.piste{background:#EAF1FB;border-radius:12px;padding:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>Le Tour de roue</h1>
<p class="sub">Une roue roule : à toi de calculer la distance ou de compter les tours, avec π ≈ 3,14.</p>
<div class="card" id="jeu"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const F=x=>String(Math.round(x*100)/100).replace('.',',');
const num=s=>parseFloat(String(s).trim().replace(/\s/g,'').replace(',','.'));
const NS='http://www.w3.org/2000/svg';
function fin(score,total,again){
  const m=score===total?'Parfait !':score>=total*0.75?'Très bien !':score>=total/2?'Bien, continue de t\'entraîner.':'Relis la méthode et recommence.';
  $('#jeu').innerHTML='<div class="fin"><div class="gros">'+score+' / '+total+'</div><p>'+m+'</p><button class="btn main" id="again">Nouvelle série</button></div>';
  $('#again').onclick=again;
}

const TOTAL=6;let mode='dist',n,score,cur;
function qd(){
  const d=pick([20,30,40,50,60,70,80,100]),t=pick([2,3,4,5,10]);
  const P=Math.round(3.14*d*100)/100;
  return mode==='dist'
   ?{d,t,txt:`Une roue de <b>${d} cm</b> de diamètre fait <b>${t} tours</b>. Quelle distance parcourt-elle, en cm ? (π ≈ 3,14)`,bon:Math.round(P*t*100)/100,unite:'cm',expl:`Un tour : 3,14 × ${d} = ${F(P)} cm. ${t} tours : ${t} × ${F(P)} = ${F(P*t)} cm.`}
   :{d,t,txt:`Une roue de <b>${d} cm</b> de diamètre a parcouru <b>${F(P*t)} cm</b>. Combien de tours a-t-elle faits ? (π ≈ 3,14)`,bon:t,unite:'tours',expl:`Un tour : 3,14 × ${d} = ${F(P)} cm. ${F(P*t)} ÷ ${F(P)} = ${t} tours.`};
}
function roue(d,t,anim){
  const R=Math.max(14,Math.min(36,d/2.2)),W=520,H=100,y=H-R-6,x0=30;
  const L=3.14*d*t,K=(W-60-2*R)/Math.max(L,1)*0.9;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" class="piste" role="img" aria-label="Roue qui roule sur une piste">`;
  s+=`<line x1="10" y1="${H-4}" x2="${W-10}" y2="${H-4}" stroke="#22303F" stroke-width="3"/>`;
  s+=`<g id="rg" transform="translate(${x0+R} ${y})"><circle r="${R}" fill="#fff" stroke="#22303F" stroke-width="4"/><line x1="0" y1="0" x2="0" y2="${-R}" stroke="#E8700F" stroke-width="4"/><circle r="3" fill="#22303F"/></g>`;
  s+=`<line id="tr" x1="${x0+R}" y1="${H-8}" x2="${x0+R}" y2="${H-8}" stroke="#C0392B" stroke-width="5"/>`;
  return s+'</svg>';
}
function jouer(){
  const svg=document.querySelector('#roue svg'),g=svg.querySelector('#rg'),tr=svg.querySelector('#tr');
  const R=Math.max(14,Math.min(36,cur.d/2.2)),W=520,x0=30,L=3.14*cur.d*cur.t,K=(W-60-2*R)/Math.max(L,1)*0.9;
  const red=matchMedia('(prefers-reduced-motion:reduce)').matches,D=red?1:2600,t0=performance.now();
  (function f(now){const p=Math.min(1,(now-t0)/D),dist=L*p*K;
    g.setAttribute('transform',`translate(${x0+R+dist} ${100-R-6}) rotate(${p*cur.t*360})`);
    tr.setAttribute('x2',x0+R+dist);if(p<1)requestAnimationFrame(f)})(t0);
}
function show(){
  cur=Q[n];
  $('#jeu').innerHTML=`<div class="mode"><button class="btn ${mode==='dist'?'on':''}" id="m1">Calculer la distance</button><button class="btn ${mode==='tours'?'on':''}" id="m2">Compter les tours</button></div>
  <div class="top"><span class="pill">Question ${n+1} / ${TOTAL}</span><span class="pill">Score : ${score}</span></div>
  <div class="q">${cur.txt}</div><div class="schema" id="roue">${roue(cur.d,cur.t)}</div>
  <input type="text" id="rep" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"> <span>${cur.unite}</span> <button class="btn main" id="val">Valider</button>
  <div class="msg" id="msg"></div><button class="btn main" id="suiv" hidden>Suite</button>`;
  $('#m1').onclick=()=>{mode='dist';start()};$('#m2').onclick=()=>{mode='tours';start()};
  const go=()=>{const v=num($('#rep').value);if(isNaN(v))return;const ok=Math.abs(v-cur.bon)<0.006;if(ok)score++;
    $('#rep').disabled=true;$('#val').disabled=true;$('#msg').className='msg '+(ok?'ok':'ko');$('#msg').textContent=(ok?'Juste ! ':'Pas tout à fait. ')+cur.expl+' Regarde la roue rouler.';
    $('#suiv').hidden=false;$('#suiv').textContent=n+1<TOTAL?'Question suivante':'Voir mon score';jouer()};
  $('#val').onclick=go;$('#rep').onkeydown=e=>{if(e.key==='Enter')go()};$('#rep').focus();
  $('#suiv').onclick=()=>{n++;n<TOTAL?show():fin(score,TOTAL,start)};
}
let Q;
function start(){Q=Array.from({length:TOTAL},qd);n=0;score=0;show()}
start();

</script>
<script src="../../assets/catalogue.js"></script>
<script src="../../assets/barre.js"></script>
</body>
</html>
