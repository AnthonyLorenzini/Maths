<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--bg:#fffef8;--panel:#fff;--ink:#1b2a5e;--muted:#56608a;--line:#c3d1ec;--grid:#dbe5f6;--amber:#ffc61a;--amber-ink:#9c1c2a;--fill-2:#fff4b8;
--f-title:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-text:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 var(--f-text);padding:16px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:800 clamp(2.1rem,7vw,3.2rem)/.95 var(--f-title);text-transform:uppercase;margin:0}
.sub{margin:0;color:var(--muted)}
.fig[hidden]{display:none}
.fig{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:8px}
.fig svg{display:block;width:100%;height:auto;max-height:250px}
.fig p{margin:4px 4px 0;font-size:.9rem;color:var(--muted)}
#rech{font:500 1rem var(--f-text);width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.chap{font:800 1.25rem/1.1 var(--f-title);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:10px 0 0}
.ent[hidden],h3.chap[hidden]{display:none}
.ent{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;scroll-margin-top:12px}
.ent h2{font:800 1.5rem/1.1 var(--f-title);text-transform:uppercase;margin:0 0 4px;color:var(--ink)}
.ent p{margin:0 0 6px}
.ent p:last-child{margin:0}
.ent .court{font-weight:500}
.ent.on{border-color:var(--amber-ink)}
.ent.on h2{color:var(--amber-ink)}
a.retour{align-self:flex-start;font:600 .95rem var(--f-text);color:#fff;background:var(--ink);padding:8px 14px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Glossaire</h1>
    <p class="sub">Touche un mot pour le retrouver. Pour le cercle, il s'affiche aussi sur le schéma.</p>
  </header>
  <div class="fig" id="fig"><svg id="sch" viewBox="0 0 320 190" role="img" aria-label="Schéma d'un cercle"></svg><p id="legende">Cercle de centre O</p></div>
  <input id="rech" type="search" placeholder="Chercher un mot" aria-label="Chercher un mot" autocomplete="off">
  <div id="liste" class="wrap" style="gap:10px"></div>
  <a class="retour" href="javascript:history.back()">Retour</a>
</div>
<script src="../../assets/glossaire.js"></script>
<script>
(function(){
var T=window.GLOSSAIRE.termes,cx=160,cy=95,R=70,INK='#1b2a5e',HI='#d62839';
function pt(a){a=a*Math.PI/180;return[cx+R*Math.cos(a),cy-R*Math.sin(a)];}
function arc(a1,a2){var p=pt(a1),q=pt(a2);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+R+' '+R+' 0 '+((a2-a1)>180?1:0)+' 0 '+q[0].toFixed(1)+' '+q[1].toFixed(1);}
function seg(p,q,c,w,d){return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linecap="round"/>';}
function dessin(k){
 var c=function(n){return k===n?HI:INK;},w=function(n){return k===n?5:2.5;};
 var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="'+(k==='disque'?'#fff4b8':'#fff')+'"/>';
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+(k==='cercle'?HI:INK)+'" stroke-width="'+(k==='cercle'?5:2.5)+'"/>';
 if(k==='demi')s+='<path d="'+arc(180,360)+'" fill="none" stroke="'+HI+'" stroke-width="5" stroke-linecap="round"/>';
 if(k==='arc')s+='<path d="'+arc(35,115)+'" fill="none" stroke="'+HI+'" stroke-width="5" stroke-linecap="round"/>';
 s+=seg(pt(180),pt(0),c('diametre'),w('diametre'),k==='diametre'?'':'6 4');
 s+=seg([cx,cy],pt(40),c('rayon'),w('rayon'));
 s+=seg(pt(130),pt(215),c('corde'),w('corde'));
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(k==='centre'?7:4.5)+'" fill="'+c('centre')+'"/>';
 s+='<text x="'+(cx-6)+'" y="'+(cy+18)+'" font-size="14" fill="'+INK+'" font-family="Work Sans,sans-serif">O</text>';
 return s;}
var sch=document.getElementById('sch'),leg=document.getElementById('legende'),liste=document.getElementById('liste');
var ORDRE=['Tous niveaux · Calcul et nombres','Tous niveaux · Géométrie','Tous niveaux · Mesures et grandeurs','Tous niveaux · Raisonnement'];
T.forEach(function(t){if(ORDRE.indexOf(t.chap)<0)ORDRE.push(t.chap);});
var tri=function(x,y){return x.nom.localeCompare(y.nom,'fr');};
ORDRE.forEach(function(c){
 var g=T.filter(function(t){return t.chap===c;}).sort(tri);
 if(!g.length)return;
 var hc=document.createElement('h3');hc.className='chap';hc.textContent=c;liste.appendChild(hc);
 g.forEach(function(t){
  var d=document.createElement('div');d.className='ent';d.id=t.id;d.dataset.nom=t.nom.toLowerCase();
  var h=document.createElement('h2');h.textContent=t.nom;d.appendChild(h);
  var p=document.createElement('p');p.className='court';p.textContent=t.court;d.appendChild(p);
  t.long.forEach(function(x){var q=document.createElement('p');q.textContent=x;d.appendChild(q);});
  d.addEventListener('click',function(){choisir(t.id,false);});
  liste.appendChild(d);});});
var rech=document.getElementById('rech');
rech.addEventListener('input',function(){
 var q=rech.value.trim().toLowerCase();
 var norm=function(x){return x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');};
 Array.prototype.forEach.call(liste.children,function(el){
  if(el.tagName==='H3'){return;}
  var ok=!q||norm(el.dataset.nom+' '+el.textContent.toLowerCase()).indexOf(norm(q))>=0;
  el.hidden=!ok;});
 Array.prototype.forEach.call(liste.querySelectorAll('h3.chap'),function(h){
  var n=h.nextElementSibling,vu=false;
  while(n&&n.tagName!=='H3'){if(!n.hidden)vu=true;n=n.nextElementSibling;}
  h.hidden=!vu;});});
function choisir(id,aller){
 var t=null;T.forEach(function(x){if(x.id===id)t=x;});
 Array.prototype.forEach.call(document.querySelectorAll('.ent'),function(e){e.classList.toggle('on',e.id===id);});
 var fig=document.getElementById('fig');
 fig.hidden=!(t&&t.schema);
 if(t&&t.schema){sch.innerHTML=dessin(t.schema);leg.textContent='En rouge : '+t.nom;}
 if(t&&aller){document.getElementById(id).scrollIntoView({block:'start'});}}
function depuisAdresse(){var id=decodeURIComponent(location.hash.replace('#',''));choisir(id,!!id);}
document.getElementById('fig').hidden=true;
window.addEventListener('hashchange',depuisAdresse);
depuisAdresse();
})();
</script>
<script src="../../assets/stats.js"></script>
</body>
</html>
