<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dernier Signal · Opération Pythagore — Escape game 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout : console de flotte projetée — barre (titre | minuteur | carte) puis flotte ou décor de salle */
:root{
  --bg:#0b1220; --panel:#121c2e; --panel2:#17233a; --line:#26354f;
  --fg:#e9eef7; --muted:#8ea0bc; --amber:#ffb547; --ok:#5fd68a; --bad:#ff6b6b; --info:#7cc8ff;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 80% -10%,#1a2a48 0,transparent 45%)}
img{max-width:100%}
.wrap{max-width:1400px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{display:grid;grid-template-columns:1fr auto minmax(0,320px);gap:14px;align-items:stretch}
.brand{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.brand h1{font-family:var(--display);font-size:clamp(28px,3.4vw,44px);margin:0;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--amber)}
.brand p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.timer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:230px}
.clock{font-family:var(--display);font-size:clamp(44px,5vw,66px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--amber)}
.clock.low{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);color:#1b1300;border-color:var(--amber);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.map{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.map h2{margin:0 0 4px;font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.map svg{width:100%;height:auto;display:block}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head h2{margin:0;font-family:var(--display);font-size:clamp(24px,2.8vw,36px);text-transform:uppercase;letter-spacing:.04em}
.tag{font-family:var(--display);font-size:14px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.pill{font-family:var(--display);font-size:15px;padding:4px 12px;border-radius:99px;border:2px solid currentColor;letter-spacing:.06em;text-transform:uppercase}

/* Flotte */
.fleet{display:flex;flex-direction:column;gap:10px}
.ship{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 16px}
.ship .nm{font-family:var(--display);font-size:28px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em;line-height:1}
.ship .st{font-size:14px;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.done{background:#5fd68a22;border-color:var(--ok);color:var(--ok)}
.cell.here{border:2px solid var(--c);color:var(--fg);background:color-mix(in srgb,var(--c) 18%,transparent)}
.enter{font-size:18px;padding:10px 18px}
.final{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px 18px}
.final.ready{border:2px solid var(--amber)}
.final p{margin:0;font-size:18px}

.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero .scene{display:flex}.hero .scene svg{max-height:none;height:auto;width:100%}.hero.mini{grid-template-columns:1fr}.hero.mini .scene svg{max-height:68vh}
.scene svg.zoom{transition:transform .95s cubic-bezier(.6,0,.9,.4),opacity .35s .6s;transform:scale(10);opacity:0}
.scene.enter svg{animation:iris 1.1s ease-out}
@keyframes iris{from{clip-path:circle(0% at 50% 55%);transform:scale(1.25)}to{clip-path:circle(150% at 50% 55%);transform:scale(1)}}
.sg{cursor:pointer;transition:transform 2.6s cubic-bezier(.45,0,.25,1)}
.sg:focus{outline:none}.halo{transition:opacity .2s}
.sg:hover .halo,.sg:focus-visible .halo{opacity:.32}
.bob{animation:bob 4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(6px)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 2.4s ease-out infinite}
@keyframes smoke{from{transform:translate(0,0) scale(.5);opacity:.55}to{transform:translate(-10px,-22px) scale(1.8);opacity:0}}
.flick{animation:flick .9s steps(3) infinite}@keyframes flick{50%{opacity:.15}}
.blink{animation:flick 1.4s steps(2) infinite}
.rflash{transform-box:fill-box;transform-origin:center;animation:rf 1.4s ease-out backwards}
@keyframes rf{from{transform:scale(.3);opacity:1}to{transform:scale(4);opacity:0}}
.rlabel{animation:rl 3.4s ease-out both}
.ember{animation:flick .9s steps(3) infinite}.plume{transform-box:fill-box;transform-origin:right center;animation:plm .12s ease-in-out infinite alternate}@keyframes plm{to{transform:scaleX(.85)}}
.deb{transform-box:fill-box;transform-origin:center;animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(8px,-6px) rotate(40deg)}}
.rg{transition:transform 2.6s cubic-bezier(.45,0,.25,1)}@keyframes rl{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.weld{animation:wl 1.6s linear both}@keyframes wl{0%,40%{opacity:1}50%{opacity:.1}90%{opacity:1}100%{opacity:0}}
.flame{transform-box:fill-box;transform-origin:right center;animation:fl .18s ease-in-out infinite alternate}@keyframes fl{to{transform:scaleX(.7)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{from{transform:scale(.8);opacity:.6}to{transform:scale(1.25);opacity:0}}
.brief{display:flex;flex-direction:column;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.brief h3{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.brief p{margin:0;font-size:19px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;font-size:18px;line-height:1.3}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#1b1300;font-family:var(--display);font-weight:700;font-size:18px}
.brief .cost{margin-top:auto;border:1px dashed var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px;font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.lost{animation:blink 1.4s steps(2) infinite}
@media (max-width:1000px){.hero{grid-template-columns:1fr}}
/* Salle */
.scene{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#060a12}
.scene svg{display:block;width:100%;height:auto;max-height:62vh}
.bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
.info{display:flex;flex-direction:column;gap:8px;min-width:0}
.info p{margin:0;font-size:19px}
.hint{background:#ffb5471a;border:1px dashed var(--amber);border-radius:10px;padding:10px 14px;font-size:18px}
.sol{font-size:14px;color:var(--info);font-family:var(--display);letter-spacing:.08em}
.answer{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.answer label{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--muted)}
.answer .row{display:flex;gap:8px}
.answer input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:8px;color:var(--fg);font-family:var(--display);font-size:32px;padding:4px 12px;letter-spacing:.15em;text-transform:uppercase}
.answer input.shake{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rules{font-size:13px;color:var(--muted);margin:0}
.flash{position:fixed;inset:0;display:grid;place-items:center;background:#05080fcc;z-index:25;pointer-events:none}
.flash div{font-family:var(--display);font-size:clamp(40px,7vw,90px);font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.06em;animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.overlay{position:fixed;inset:0;background:#05080fe6;display:grid;place-items:center;padding:24px;z-index:20}
.overlay .box{max-width:740px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.overlay h2{font-family:var(--display);font-size:clamp(40px,6vw,76px);margin:0;text-transform:uppercase;letter-spacing:.05em}
.overlay p{font-size:22px;margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bad);color:#1a0000;font-family:var(--display);font-weight:700;font-size:22px;padding:10px 20px;border-radius:10px;z-index:30}
@media (max-width:1000px){
  .top{grid-template-columns:1fr}.timer{min-width:0}
  .ship{grid-template-columns:1fr}.bar{grid-template-columns:1fr}
  .track{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Porte d'entrée : jeu réservé tant que la séance n'a pas été faite en classe */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{max-width:460px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h1{margin:0;font-family:var(--display);font-size:34px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.gate h1 span{color:var(--amber)}
.gate p{margin:0;color:var(--muted)}
.gate form{display:flex;gap:8px}
.gate input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:20px;padding:8px 12px}
.gate .err{color:var(--bad);min-height:1.4em;font-size:16px}
.gate a{color:var(--info)}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="box">
    <h1>Dernier <span>Signal</span></h1>
    <p>🔒 Pas encore vu en classe. Cet escape game sera ouvert en temps voulu.</p>
    <form id="gateForm"><input type="password" id="gatePw" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="off"><button class="btn primary" type="submit">Entrer</button></form>
    <div class="err" id="gateErr" aria-live="polite"></div>
    <a href="../../index.html">← Retour au site</a>
  </div>
</div>

<div id="jeu" hidden>
<div class="wrap">
  <header class="top">
    <div class="brand"><p>Flotte Hélios · Opération Pythagore</p><h1>Dernier <span>Signal</span></h1></div>
    <div class="timer">
      <div class="clock" id="clock">50:00</div>
      <div class="ctrls">
        <button class="btn primary" id="play">Démarrer</button>
        <button class="btn" id="dur">50 min</button>
        <button class="btn" id="solBtn">Solutions</button>
        <button class="btn danger" id="reset">Réinitialiser</button>
      </div>
    </div>
    <nav class="map" aria-label="Carte de la flotte"><h2><span>Carte de la flotte</span><span id="prog"></span></h2><svg viewBox="0 0 220 96" id="map" role="img" aria-label="Position de chaque vaisseau"></svg></nav>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div id="layer"></div>
</div>

<script src="../../assets/catalogue.js"></script>
<script>
(function(){
  var ok=!!window.SITE_PROF;
  document.getElementById("jeu").hidden=!ok;
  document.getElementById("gate").hidden=ok;
  if(ok)return;
  var f=document.getElementById("gateForm"),i=document.getElementById("gatePw"),e=document.getElementById("gateErr");
  f.addEventListener("submit",function(ev){ev.preventDefault();
    if(window.SITE_ouvrir(i.value)){location.reload()}else{e.textContent="Mot de passe incorrect.";i.select()}});
})();
</script>
<script>
(function(){
if(!window.SITE_PROF)return;
const ROOMS=[
 {id:"sas",name:"Sas d'arrivée",short:"Sas",page:1,hint:"L'hypoténuse est le côté en face de l'angle droit. C'est toujours le plus long des trois côtés."},
 {id:"labo",name:"Laboratoire",short:"Labo",page:2,hint:"Aire du grand carré = aire d'un petit carré + aire de l'autre petit carré. Où est le « ? » : sur le grand ou sur un petit ?"},
 {id:"machines",name:"Salle des machines",short:"Machines",page:3,hint:"√49 = 7 car 7 × 7 = 49. La plaque fausse est celle dont la racine carrée n'est pas un nombre entier."},
 {id:"nav",name:"Navigation",short:"Navig.",page:4,hint:"L'hypoténuse relie les deux étoiles qui n'ont PAS l'angle droit. Écrivez : hypoténuse² = côté² + côté²."},
 {id:"comms",name:"Communications",short:"Comms",page:5,hint:"Le câble est l'hypoténuse : câble² = hauteur² + distance². Il reste à prendre la racine carrée."},
 {id:"serre",name:"Serre",short:"Serre",page:6,hint:"La passerelle est l'hypoténuse. hauteur² = passerelle² − distance², puis racine carrée."}
];
/* Données par vaisseau — vérifiées par verif.py
   sas : ordre des tuiles du dossier ; lab : aires [petit, petit, grand], null = « ? » ;
   mach : 4 plaques (une seule n'est pas un carré parfait) ;
   nav : r = sommet de l'angle droit, x/y = autres sommets, a = r–x, b = r–y, h = x–y, show = côtés affichés ;
   comms : [hauteur du mât, distance au sol] ; serre : [passerelle, distance au sol]. */
const SHIPS=[
 {id:"orion",name:"Orion",c:"#ffb547",frag:12,d:{sas:[2,5,1,4],lab:[9,16,null],mach:[49,80,81,25],nav:{r:"R",x:"O",y:"N",a:6,b:8,h:10,show:["h","a"],rot:0},comms:[9,12],serre:[13,5]},ans:["8936","25","795","64","15","12"]},
 {id:"vega",name:"Véga",c:"#7cc8ff",frag:24,d:{sas:[6,3,4,2],lab:[25,null,169],mach:[64,36,50,81],nav:{r:"V",x:"E",y:"G",a:5,b:12,h:13,show:["a","b"],rot:200},comms:[8,15],serre:[25,7]},ans:["4168","144","869","169","17","24"]},
 {id:"lyra",name:"Lyra",c:"#c9a2ff",frag:8,d:{sas:[1,6,5,3],lab:[36,64,null],mach:[81,17,16,64],nav:{r:"Y",x:"L",y:"R",a:12,b:5,h:13,show:["h","a"],rot:110},comms:[10,24],serre:[10,6]},ans:["3491","100","948","25","26","8"]},
 {id:"draco",name:"Draco",c:"#5fd68a",frag:15,d:{sas:[4,1,2,6],lab:[null,64,289],mach:[9,63,64,49],nav:{r:"R",x:"D",y:"A",a:7,b:24,h:25,show:["a","b"],rot:300},comms:[20,21],serre:[17,8]},ans:["6384","225","387","625","29","15"]},
 {id:"cygnus",name:"Cygnus",c:"#ff8a6b",frag:32,d:{sas:[5,3,6,1],lab:[144,null,400],mach:[36,49,99,16],nav:{r:"C",x:"G",y:"Y",a:21,b:20,h:29,show:["h","a"],rot:30},comms:[12,16],serre:[40,24]},ans:["9143","256","674","400","20","32"]}
];
const FINAL="156", PEN_WRONG=60, PEN_HINT=60, KEY="dernier-signal-pythagore-v1";

/* ---------- Décors ---------- */
const F='font-family="Chakra Petch, sans-serif"';
function defs(c){return `<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4d70"/><stop offset="1" stop-color="#1c2840"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>
 <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="hz" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" fill="#ffb547"/><rect x="12" width="12" height="24" fill="#1b1300"/></pattern>
 <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="${c}" stroke-opacity=".12"/></pattern>
</defs>`}
function room(c,body){return `<svg viewBox="0 0 800 420" role="img">${defs(c)}<rect width="800" height="420" fill="url(#wall)"/>
 ${[80,240,560,720].map(x=>`<rect x="${x}" y="0" width="6" height="350" fill="#22324f"/>`).join("")}
 <rect y="350" width="800" height="70" fill="#080d17"/>${Array.from({length:9},(_,i)=>`<line x1="${i*100}" y1="350" x2="${i*100-60}" y2="420" stroke="#1a263c"/>`).join("")}
 <line x1="0" y1="350" x2="800" y2="350" stroke="#33476a" stroke-width="3"/>${body}</svg>`}
function screen(x,y,w,h,title,c){return `<rect x="${x-10}" y="${y-34}" width="${w+20}" height="${h+44}" rx="14" fill="#0e1626" stroke="#33476a" stroke-width="3"/>
 <text x="${x+w/2}" y="${y-12}" text-anchor="middle" ${F} font-size="16" letter-spacing="3" fill="#8ea0bc">${title}</text>
 <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#03101a" stroke="${c}" stroke-opacity=".5"/>`}
function stars(n,x0,y0,w,h,seed){let s="",r=seed;for(let i=0;i<n;i++){r=(r*9301+49297)%233280;const x=x0+r/233280*w;r=(r*9301+49297)%233280;const y=y0+r/233280*h;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%7?1:2}" fill="#fff" opacity="${i%3?.5:.9}"/>`}return s}
/* Géométrie : ajuste une liste de points [x,y] (y vers le haut) dans un cadre, renvoie la fonction de passage */
function fitBox(pts,x0,y0,w,h){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);
 const k=Math.min(w/(Mx-mx),h/(My-my)),ox=x0+(w-(Mx-mx)*k)/2,oy=y0+(h-(My-my)*k)/2;return p=>[ox+(p[0]-mx)*k,oy+(My-p[1])*k]}
const P=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
/* Marque d'angle droit en Q (coordonnées écran), vers P1 et P2 */
function rmark(Q,P1,P2,s,col){const u=[P1[0]-Q[0],P1[1]-Q[1]],v=[P2[0]-Q[0],P2[1]-Q[1]],nu=Math.hypot(...u),nv=Math.hypot(...v);
 const A=[Q[0]+u[0]/nu*s,Q[1]+u[1]/nu*s],B=[Q[0]+v[0]/nv*s,Q[1]+v[1]/nv*s],M=[A[0]+v[0]/nv*s,A[1]+v[1]/nv*s];
 return `<polyline points="${P([A,M,B])}" fill="none" stroke="${col}" stroke-width="2.5"/>`}
function tglyph(x,y,s,c){return `<polygon points="${x},${y} ${x},${y+s} ${x+s*1.4},${y+s}" fill="none" stroke="${c}" stroke-width="2"/><rect x="${x}" y="${y+s-7}" width="7" height="7" fill="none" stroke="${c}" stroke-width="1.5"/>`}

<g class='${st<6?'bob':''}' style='animation-delay:-${i*.9}s'><g class='rg' data-rg='${s.id}' style='transform:rotate(${qrot}deg) scale(${.9*p.f},.9)'><g style='filter:brightness(${.62+st*.063}) saturate(${.5+st*.085})'>${R_ship(i,s.c,st)}</g>${R_smoke(i,st)}${fl}</g></g>${labels}
${st>=6?`<text y='50' text-anchor='middle' ${F} font-weight='700' font-size='15' letter-spacing='3' fill='${s.c}'>${s.name.toUpperCase()} · ${s.frag}</text>`:`<text y='58' text-anchor='middle' ${F} font-weight='700' font-size='19' letter-spacing='4' fill='${s.c}'>${s.name.toUpperCase()}</text>
<text y='76' text-anchor='middle' ${F} font-size='13' letter-spacing='2' fill='#a9b8d0'>RÉPARATION ${st} / 6</text>${pips}`}</g>`}).join('');
setTimeout(()=>{moves.forEach(([id,x,y,d,r,f])=>{const g=document.querySelector(`.sg[data-ship='${id}']`),h=document.querySelector(`.rg[data-rg='${id}']`);if(g){g.style.transitionDelay=d+'ms';g.style.transform=`translate(${x}px,${y}px)`}if(h){h.style.transitionDelay=d+'ms';h.style.transform=`rotate(${r}deg) scale(${.9*f},.9)`}SHOWN[id]=S.ships[id].step})},80);
return `<svg viewBox='0 0 800 440' role='img' aria-label='Cinq vaisseaux autour du réacteur'>${defs('#ffb547')}${R_defs()}
<rect width='800' height='440' fill='#02040a'/><rect width='800' height='440' filter='url(#neb)' opacity='.55'/><rect width='800' height='440' filter='url(#neb2)' opacity='.28'/>
${stars(200,0,0,800,440,11)}
<circle cx='-30' cy='430' r='168' fill='#7cc8ff' opacity='.2' filter='url(#b3)'/><circle cx='-30' cy='430' r='160' fill='url(#plan)'/><circle cx='-30' cy='430' r='160' fill='#fff' filter='url(#cloud)' opacity='.5'/>
<g transform='translate(0 70)'>${R_reactor(dk)}</g>
${ships}
<g transform='translate(0 70)'><text class='${S.final?'':'lost'}' x='400' y='-44' text-anchor='middle' ${F} font-weight='700' font-size='20' letter-spacing='7' fill='${S.final?'#5fd68a':'#ff6b6b'}'>${S.final?'SIGNAL RÉTABLI':'SIGNAL PERDU'}</text>
${allDone()&&!S.final?`<circle class='ping' cx='400' cy='150' r='76' fill='none' stroke='#ffb547' stroke-width='3'/><circle data-go='reacteur' cx='400' cy='150' r='80' fill='transparent' style='cursor:pointer'/>`:''}</g></svg>`}

function enterShip(id){
 if(entering)return;
 const open=()=>{entering=false;ENTER=S.ships[id].step<6;S.view=id;save();render();window.scrollTo({top:0})};
 const svg=document.querySelector(".scene svg"),i=SHIPS.findIndex(s=>s.id===id);
 if(!svg||S.view!=="flotte"||matchMedia("(prefers-reduced-motion:reduce)").matches)return open();
 entering=true;const p=shipPos(i,S.ships[id].step>=6?6:0);
 svg.style.transformOrigin=`${p.x/8}% ${p.y/4.4}%`;svg.classList.add("zoom");setTimeout(open,950)}
document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest(".sg");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();enterShip(g.dataset.ship)}});
function hero(mini){return `<section class="hero${mini?" mini":""}"><div class="scene">${heroScene()}</div>
 ${mini?"":`<div class="brief"><h3>Mission</h3>
  <p>Le réacteur de la flotte Hélios est éteint et les 5 vaisseaux sont endommagés. Chaque équipage traverse 6 salles : chaque salle se répare avec Pythagore. Ensemble, vous rallumerez le réacteur.</p>
  <ol class="steps"><li>Touchez votre vaisseau : l'éclaireur observe le décor de la salle et le décrit à son équipage.</li><li>L'équipage trouve le code avec le dossier papier.</li><li>Bon code : la porte s'ouvre et une partie de votre vaisseau est réparée. Vaisseau complet : il rejoint le réacteur.</li></ol>
  <div class="cost">Mauvais code ou indice : −1 min pour toute la flotte</div></div>`}</section>`}
function renderFleet(){
  const ready=allDone();
  return `${hero(!notStarted())}<div class="head"><span class="tag">Touchez un vaisseau pour entrer dans sa salle</span></div>
  <div class="final ${ready?"ready":""}"><p>${S.final?"Le réacteur est rallumé.":ready?"Les 5 vaisseaux sont réparés. Le réacteur attend vos fragments !":"Le réacteur s'ouvrira quand les 5 vaisseaux seront réparés."}</p>
    <button class="btn ${ready?"primary":""} enter" data-go="reacteur" ${ready?"":"disabled"}>Réacteur commun</button></div>`;
}
function renderShip(id){
  const s=ship(id),st=S.ships[id].step;
  if(st>=6)return `<div class="head"><button class="btn" data-go="flotte">← Flotte</button><span class="pill" style="color:${s.c}">${s.name}</span><h2>Vaisseau réparé</h2></div>
    <div class="info"><p>Fragment récupéré : <b style="font-family:var(--display);font-size:40px;color:${s.c}">${s.frag}</b></p><p>Allez aider les équipages qui ne sont pas encore réparés : le réacteur a besoin des 5 fragments.</p></div>`;
  const r=ROOMS[st],h=S.ships[id].hints[r.id],en=ENTER;ENTER=false;
  return `<div class="head"><button class="btn" data-go="flotte">← Flotte</button><span class="pill" style="color:${s.c}">${s.name}</span><h2>${r.name}</h2><span class="tag">Salle ${st+1} / 6 · dossier page ${r.page}</span></div>
   <div class="scene${en?" enter":""}">${SCENES[r.id](s.d,s.c)}</div>
   <div class="bar"><div class="info"><div class="tag" style="color:var(--amber)">Cette salle répare : ${PARTS[st]}</div><p>L'éclaireur mémorise ce qu'il voit ici, puis l'explique à son équipage. Avec la page ${r.page} du dossier, il devient possible de trouver le code.</p>
     ${h?`<div class="hint">💡 ${r.hint}</div>`:`<div><button class="btn" data-hint="${id}">Indice (−1 min)</button></div>`}
     ${S.showSol?`<div class="sol">SOLUTION ${s.name.toUpperCase()} : ${s.ans[st]}</div>`:""}</div>
    <form class="answer" id="ansForm"><label for="code">Code de la salle</label>
     <div class="row"><input id="code" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">Valider</button></div>
     <p class="rules">Mauvais code : −1 min pour toute la flotte</p></form></div>`;
}
function renderReactor(){
  return `<div class="head"><button class="btn" data-go="flotte">← Flotte</button><h2>Réacteur commun</h2><span class="tag">Dossier page 7 · toute la classe</span></div>
   <div class="scene">${SCENES.reacteur()}</div>
   <div class="bar"><div class="info"><p>Le code du réacteur se calcule avec les 5 fragments (page 7 du dossier). Tous les équipages se mettent d'accord avant d'envoyer un délégué.</p>${S.showSol?`<div class="sol">SOLUTION : ${FINAL}</div>`:""}</div>
   ${S.final?`<div class="answer"><strong style="color:var(--ok);font-family:var(--display);font-size:24px">RÉACTEUR RALLUMÉ</strong></div>`:
   `<form class="answer" id="ansForm"><label for="code">Code du réacteur</label><div class="row"><input id="code" autocomplete="off"><button class="btn primary" type="submit">Valider</button></div><p class="rules">Mauvais code : −1 min</p></form>`}</div>`;
}
function render(){
  renderClock();renderMap();
  const v=S.view;$("stage").innerHTML=v==="flotte"?renderFleet():v==="reacteur"?renderReactor():renderShip(v);
  const f=$("ansForm");if(f){f.addEventListener("submit",e=>{e.preventDefault();check()});setTimeout(()=>{const i=$("code");if(i)i.focus()},40)}
}
function check(){
  const inp=$("code"),v=norm(inp.value);if(!v)return;
  let good;
  if(S.view==="reacteur")good=v===FINAL;else{const s=ship(S.view);good=v===s.ans[S.ships[s.id].step]}
  if(good){
    if(S.view==="reacteur"){S.final=true;save();render();return win()}
    S.ships[S.view].step++;ENTER=S.ships[S.view].step<6;save();flash(S.ships[S.view].step>=6?"Vaisseau réparé":"Porte ouverte");render();
  }else{S.left=Math.max(0,S.left-PEN_WRONG);save();toast("Code refusé · −1 min");inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.select();renderClock();if(S.left<=0)lose()}
}
function flash(t){const d=document.createElement("div");d.className="flash";d.innerHTML=`<div>${t}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function overlay(h){$("layer").innerHTML=`<div class="overlay"><div class="box">${h}<button class="btn" id="closeOv">Fermer</button></div></div>`}
function win(){S.running=false;save();renderClock();overlay(`<div style="font-size:72px">🛰️</div><h2 style="color:var(--ok)">Signal rétabli</h2><p>La flotte rentre sur Terre avec <b style="color:var(--amber)">${fmt(S.left)}</b> d'avance.</p><p>Débrief : dans quelles salles fallait-il <b>additionner</b> les carrés, et dans lesquelles <b>soustraire</b> ? Comment le saviez-vous ?</p>`)}
function lose(){S.running=false;save();renderClock();overlay(`<div style="font-size:72px">📡</div><h2 style="color:var(--bad)">Signal perdu</h2><p>Le temps est écoulé. ${SHIPS.filter(s=>S.ships[s.id].step>=6).length} vaisseau(x) sur 5 réparé(s).</p>`)}

document.addEventListener("click",e=>{
  const sh=e.target.closest("[data-ship]");if(sh){enterShip(sh.dataset.ship);return}
  const g=e.target.closest("[data-go]");if(g&&!g.disabled){S.view=g.dataset.go;save();render();window.scrollTo({top:0});return}
  const h=e.target.closest("[data-hint]");if(h){const id=h.dataset.hint,r=ROOMS[S.ships[id].step];S.ships[id].hints[r.id]=true;S.left=Math.max(0,S.left-PEN_HINT);save();toast("Indice · −1 min");render();return}
  if(e.target.id==="closeOv")$("layer").innerHTML="";
});
$("play").onclick=()=>{if(S.left<=0)return;S.running=!S.running;save();renderClock()};
$("dur").onclick=()=>{if(S.running||S.left<S.dur)return toast("Réinitialisez pour changer la durée");const o=[40,50,55];S.dur=o[(o.indexOf(S.dur/60)+1)%o.length]*60;S.left=S.dur;save();renderClock()};
$("solBtn").onclick=()=>{S.showSol=!S.showSol;save();render()};
let armed=false;
$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="Confirmer ?";setTimeout(()=>{armed=false;$("reset").textContent="Réinitialiser"},3000);return}
  armed=false;$("reset").textContent="Réinitialiser";const d=S.dur;S=fresh();S.dur=d;S.left=d;save();$("layer").innerHTML="";render()};
setInterval(()=>{if(!S.running)return;S.left--;if(S.left%5===0)save();renderClock();if(S.left<=0)lose()},1000);
render();
})();
</script>
<script src="../../assets/barre.js"></script>
</body>
</html>
