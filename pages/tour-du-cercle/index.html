<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le tour du cercle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Base commune Leçon 4 — titres condensés, texte Work Sans, nombres Space Mono ; ambre = action, vert = juste, rouge = faux */
:root{
  color-scheme:light;
  --bg:#fffef8; --panel:#ffffff; --paper:#ffffff; --ink:#1b2a5e; --muted:#56608a; --line:#c3d1ec; --grid:#dbe5f6;
  --amber:#ffc61a; --amber-text:#d62839; --amber-ink:#9c1c2a; --fill:#ffe45e; --fill-2:#fff4b8; --on-amber:#1b2a5e;
  --ok:#17703f; --ok-bg:#dff5e6; --ko:#b3261e; --ko-bg:#ffe5e2;
  --blue:#1f56d6; --blue-bg:#e6eeff; --magenta:#b8217a; --magenta-bg:#ffe6f3; --teal:#08766f; --teal-bg:#dcf5f2;
  --f-title:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-text:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Space Mono",ui-monospace,"Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 var(--f-text);padding-inline:16px;padding-block:16px 40px;margin:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(2.1rem,7vw,3.5rem)/.9 var(--f-title);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--amber-text)}
h2{font:800 clamp(1.4rem,4.5vw,2rem)/1.05 var(--f-title);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:70ch}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{font:700 1.1rem var(--f-title);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--amber)}
@media (max-width:440px){.tabs button{padding:8px 8px;font-size:1rem}}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{font:600 .9rem var(--f-text);background:none;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:600 .95rem var(--f-text);border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--amber)}
.btn.main{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.recit{margin:0;padding:12px 16px;background:var(--panel);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;max-width:75ch}
.num{font-family:var(--f-num);font-weight:700}
.fr{display:inline-flex;flex-direction:column;align-items:center;font:700 1em var(--f-num);line-height:1.05;vertical-align:middle}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}
.msg{min-height:1.5em;font-weight:600;margin:0}
.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
input.ans{font:700 1.25rem var(--f-num);text-align:center;border:2px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:6px 4px;width:6em;max-width:100%}
input.ans:focus{outline:none;border-color:var(--amber)}
input.ans.ok{border-color:var(--ok);background:var(--ok-bg)}
input.ans.ko{border-color:var(--ko);background:var(--ko-bg)}
.lvl{font:600 .85rem var(--f-text);color:var(--muted)}
/* équipes */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.teams{grid-template-columns:minmax(0,1fr)}}
.team{border:2px solid var(--tc);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.team.t0{--tc:var(--blue);--tb:var(--blue-bg)}.team.t1{--tc:var(--magenta);--tb:var(--magenta-bg)}.team.t2{--tc:var(--teal);--tb:var(--teal-bg)}
.team .th{background:var(--tb);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.team .tn{font:800 1.3rem var(--f-title);text-transform:uppercase;letter-spacing:.05em;color:var(--tc)}
.team .ts{font:700 1.5rem var(--f-num);color:var(--tc)}
.team .tb{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.team .draw{display:flex;align-items:center;gap:10px}
.team .draw button{font:600 .85rem var(--f-text);border:2px solid var(--tc);color:var(--tc);background:none;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px}
.team .who{font:700 1.4rem var(--f-num);color:var(--tc);min-width:2ch}
.team.turn{box-shadow:0 0 0 4px var(--tc)}
.team.win{animation:pop .5s}
.team .res{font-weight:600;min-height:1.4em}
.team .res.ok{color:var(--ok)}.team .res.ko{color:var(--ko)}
@keyframes pop{50%{transform:scale(1.04)}}
.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.settings input{width:4em;font:700 .95rem var(--f-num);border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:3px 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.team .slot:empty,.team .res:empty{display:none}
.teams.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.teams.compact .th{flex-direction:column;align-items:flex-start;gap:0;padding:6px 10px}
.teams.compact .tn{font-size:1.05rem}
.teams.compact .ts{font-size:1.3rem}
.teams.compact .tb{padding:6px 10px}
.teams.compact .draw{flex-wrap:wrap;gap:4px 8px}
.teams.compact .draw button{padding:4px 8px;min-height:32px;font-size:.8rem}
.teams.compact .who{font-size:1.1rem}
@media (max-width:420px){.teams.compact .tn{font-size:.9rem;letter-spacing:.02em}}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.grp{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:100%}
</style>
<script>
window.L4=(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* nombre en écriture française, sans zéros inutiles (dp = nb max de décimales) */
const fmt=(x,dp=3)=>{let s=(Math.round(x*10**dp)/10**dp).toFixed(dp);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');const [a,b]=s.split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(b?','+b:'');};
const fmt2=x=>(Math.round(x*100)/100).toFixed(2).replace('.',',');
/* lecture d'une réponse : "3,5" "3.5" "35/100" "35 %" "1 + 3/10" ; NaN si illisible */
function parse(v){
  if(v==null)return NaN;v=String(v).trim().replace(/\s+/g,'').replace(/%$/,'');
  if(!v)return NaN;
  if(v.includes('+'))return v.split('+').reduce((s,p)=>s+parse(p),0);
  const m=v.match(/^(\d+(?:[.,]\d+)?)\/(\d+(?:[.,]\d+)?)$/);
  if(m){const d=+m[2].replace(',','.');return d?(+m[1].replace(',','.'))/d:NaN;}
  if(!/^-?\d+(?:[.,]\d+)?$/.test(v)&&!/^-?[.,]\d+$/.test(v))return NaN;
  return +v.replace(',','.');
}
const same=(a,b)=>Math.abs(a-b)<1e-9;
const store={get(k,d){try{const v=localStorage.getItem('l4.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem('l4.'+k,JSON.stringify(v));}catch(e){}}};
/* onglets simples : <nav class="tabs"><button data-tab="x"> + éléments [data-pane="x"] */
function tabs(nav,onChange){
  nav.setAttribute('role','tablist');
  const go=t=>{$$('[data-tab]',nav).forEach(b=>{b.setAttribute('role','tab');b.setAttribute('aria-selected',b.dataset.tab===t);});
    $$('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==t);onChange&&onChange(t);};
  nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});
  return go;
}
/* contrôle segmenté : boutons [data-v] */
function seg(el,onChange,init){
  const set=v=>{$$('[data-v]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));onChange&&onChange(v);};
  el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)set(b.dataset.v);});
  if(init!=null)set(init);return set;
}
/* ---- trois équipes : bleu, magenta, turquoise, tirage au sort d'un élève ---- */
const TEAMS=['Bleus','Magentas','Turquoises'];
function Teams(el,opt={}){
  let size=store.get('teamSize',9);
  const T=TEAMS.map((n,i)=>({i,name:n,score:0,pool:[],who:null}));
  let turn=null;
  el.classList.add('teams');if(opt.compact)el.classList.add('compact');
  el.innerHTML=T.map(t=>`<section class="team t${t.i}" data-team="${t.i}">
    <div class="th"><span class="tn">${t.name}</span><span class="ts" aria-label="score">0</span></div>
    <div class="tb"><div class="draw"><button type="button" data-drawbtn>${opt.compact?'Tirer':'Tirer un élève'}</button><span class="who" aria-live="polite"></span></div>
    <div class="slot"></div><div class="res" aria-live="polite"></div></div></section>`).join('');
  const box=i=>el.querySelector(`[data-team="${i}"]`);
  function refill(t){t.pool=shuffle(Array.from({length:size},(_,k)=>k+1));}
  function draw(i){
    const t=T[i];if(!t.pool.length)refill(t);
    const n=t.pool.pop(),w=box(i).querySelector('.who');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){w.textContent='n°'+n;return;}
    let k=0;const iv=setInterval(()=>{w.textContent='n°'+rnd(1,size);if(++k>9){clearInterval(iv);w.textContent='n°'+n;}},55);
  }
  el.addEventListener('click',e=>{const b=e.target.closest('[data-drawbtn]');if(b)draw(+b.closest('[data-team]').dataset.team);});
  const api={
    slot:i=>box(i).querySelector('.slot'),
    res(i,txt,ok){const r=box(i).querySelector('.res');r.textContent=txt||'';r.className='res'+(ok===true?' ok':ok===false?' ko':'');},
    add(i,p=1){T[i].score+=p;box(i).querySelector('.ts').textContent=T[i].score;if(p>0){const b=box(i);b.classList.remove('win');void b.offsetWidth;b.classList.add('win');}},
    setTurn(i){turn=i;T.forEach(t=>box(t.i).classList.toggle('turn',t.i===i));},
    nextTurn(){api.setTurn(turn==null?0:(turn+1)%3);return turn;},
    get turn(){return turn;},
    scores:()=>T.map(t=>t.score),
    reset(){T.forEach(t=>{t.score=0;box(t.i).querySelector('.ts').textContent=0;api.res(t.i,'');});},
    clearWho(){T.forEach(t=>box(t.i).querySelector('.who').textContent='');},
    name:i=>T[i].name,
    settings(container){
      container.innerHTML=`<label class="settings">Élèves par équipe <input type="number" id="teamsize" min="2" max="15" value="${size}"></label>`;
      container.querySelector('input').addEventListener('change',e=>{size=Math.max(2,Math.min(15,+e.target.value||9));store.set('teamSize',size);T.forEach(refill);});
    }
  };
  T.forEach(refill);
  return api;
}
/* petit carré dessiné en SVG : n parts coloriées sur u (10 = bandes, 100 = quadrillage), plusieurs carrés si besoin */
function squaresSVG(t,u,size=60){
  const n=Math.max(1,Math.ceil(t/u)),gap=6,W=n*size+(n-1)*gap;
  let s=`<svg viewBox="-1 -1 ${W+2} ${size+2}" width="${W+2}" height="${size+2}" role="img" aria-label="carré colorié">`;
  for(let k=0;k<n;k++){const x0=k*(size+gap);
    s+=`<rect x="${x0}" y="0" width="${size}" height="${size}" fill="var(--paper)"/>`;
    const c=size/10;
    for(let j=0;j<u;j++){const idx=k*u+j;if(idx>=t)break;
      if(u===10)s+=`<rect x="${x0}" y="${j*c}" width="${size}" height="${c}" fill="var(--fill)"/>`;
      else s+=`<rect x="${x0+(j%10)*c}" y="${Math.floor(j/10)*c}" width="${c}" height="${c}" fill="var(--fill)"/>`;}
    for(let j=1;j<10;j++){s+=`<line x1="${x0}" x2="${x0+size}" y1="${j*c}" y2="${j*c}" stroke="var(--grid)" stroke-width="1"/>`;
      if(u===100)s+=`<line y1="0" y2="${size}" x1="${x0+j*c}" x2="${x0+j*c}" stroke="var(--grid)" stroke-width="1"/>`;}
    s+=`<rect x="${x0}" y="0" width="${size}" height="${size}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;}
  return s+'</svg>';
}
return {$,$$,f,rnd,pick,shuffle,fmt,fmt2,parse,same,store,tabs,seg,Teams,squaresSVG};
})();
</script>
<style>
/* ---- mise en page commune des séances du chapitre 5 (même esprit que la leçon 4) ---- */
.wrap{max-width:1000px;gap:22px}
.ex{display:flex;flex-direction:column;gap:14px;padding:18px 20px;background:var(--panel);border:2px solid var(--line);border-radius:14px}
.ex .fig{background:var(--paper)}

.step{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--amber);color:var(--on-amber);font:800 .8em var(--f-title);margin-right:.4em;vertical-align:.08em}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.flow li{display:flex;gap:8px;align-items:baseline;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600}
.flow b{font:800 1.2rem var(--f-title);color:var(--amber-text)}
.flow small{color:var(--muted);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.split .fig svg{max-width:100%}
.ex-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.ex-h h2 small{font:600 .9rem var(--f-text);text-transform:none;letter-spacing:0;color:var(--muted);margin-left:.4em}
.consigne{margin:0;max-width:75ch}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.how .panel{display:flex;gap:10px;align-items:flex-start}
.how .n{font:800 1.6rem/1 var(--f-title);color:var(--amber-text)}
.how p{margin:0}
.fig{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;justify-content:center}
.fig svg{display:block;width:100%;height:auto;max-width:760px}
.fig.sm svg{max-width:520px}
.fig.plane svg{cursor:crosshair;touch-action:manipulation}
.ex:not(.show) .sol{display:none}
.ex.show .q{display:none}
.s{color:var(--ok);font-weight:600}
.qs{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:8px;max-width:75ch}
.qs li::marker{font-weight:700;color:var(--amber-ink)}
.qs.dec{list-style:decimal}
.qs .sol{display:block}
.vf{font-weight:700}
.vf.t{color:var(--ok)}.vf.f{color:var(--ko)}
table.tb{border-collapse:collapse;font:600 1.1rem var(--f-text);background:var(--panel);max-width:100%}
.tb th,.tb td{border:2px solid var(--line);padding:8px 18px;text-align:center}
.tb th{font:800 1.05rem var(--f-title);text-transform:uppercase;letter-spacing:.05em;background:var(--fill-2)}
.tb td.l{text-align:left;font-weight:700}
.tb .q{color:var(--amber-ink);font:700 1.3rem var(--f-num)}
.tb .sol{color:var(--ok);font:700 1.1rem var(--f-num)}
.arcn{display:inline-block;position:relative;padding-top:.3em;line-height:1}
.arcn::before{content:"";position:absolute;left:.04em;right:.04em;top:0;height:.3em;border:2px solid currentColor;border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 .95rem var(--f-title);text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:999px;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.chip.on,.ex.show .chip.legend{border-color:var(--bc);color:var(--ink);background:var(--bb)}
.chip[data-k=rayon]{--bc:var(--blue);--bb:var(--blue-bg)}
.chip[data-k=diam]{--bc:var(--magenta);--bb:var(--magenta-bg)}
.chip[data-k=corde]{--bc:var(--teal);--bb:var(--teal-bg)}
.chip[data-k=arc]{--bc:var(--amber);--bb:var(--fill-2)}
.chip[data-k=demi]{--bc:var(--ok);--bb:var(--ok-bg)}
.chip[data-k=dans]{--bc:var(--ok);--bb:var(--ok-bg)}
.chip[data-k=sur]{--bc:var(--amber);--bb:var(--fill-2)}
.chip[data-k=hors]{--bc:var(--ko);--bb:var(--ko-bg)}
.next{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}

</style>

<style>
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.ask{font:600 1.25rem var(--f-text);text-align:center;margin:0}
.ask b{color:var(--amber-ink)}
.score{font:700 1.2rem var(--f-num)}
select.pick{font:600 1rem var(--f-text);border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:8px;width:100%;min-height:42px}
select.pick.ok{border-color:var(--ok);background:var(--ok-bg)}
select.pick.ko{border-color:var(--ko);background:var(--ko-bg)}

<div class="wrap">
  <header class="top">
    <div><h1>Le tour du <span>cercle</span></h1>
    <p class="sub">Le périmètre d'un cercle vaut environ 3,14 fois son diamètre. Une ficelle peut-elle faire le tour ? Quel est le périmètre ? De nouvelles valeurs à chaque question. Calculatrice conseillée aux niveaux 2 et 3.</p></div>
  </header>
  <nav class="tabs" id="tabs"><button data-tab="course">Course : 3 équipes</button><button data-tab="solo">Solo</button></nav>
  <div class="row">
    <span class="grp"><span class="lvl">Niveau</span>
    <div class="seg" id="niv"><button data-v="1">Nombres entiers</button><button data-v="2">Au plus près</button><button data-v="3">Avec le rayon</button></div></span>
    <span class="grp"><span class="lvl">Figure</span>
    <div class="seg" id="vue"><button data-v="oui">Montrer</button><button data-v="non">Cacher</button></div></span>
  </div>
  <div class="panel stage">
    <div class="fig sm" id="fig" style="width:100%;border:0;padding:0"></div>
    <p class="data" id="data"></p>
    <p class="ask" id="ask"></p>
  </div>

  <section data-pane="course" class="pane">
    <div id="teams"></div>
    <div class="row"><button class="btn main" id="corr">Corriger</button><button class="btn" id="nextC">Question suivante →</button></div>
    <p class="msg" id="cmsg" aria-live="polite"></p>
    <div id="set"></div>
  </section>

  <section data-pane="solo" class="pane" hidden>
    <div class="choices" id="soloch"></div>
    <div class="row"><button class="btn" id="snext">Suivante →</button><span class="score" id="sscore"></span></div>
    <p class="msg" id="smsg" aria-live="polite"></p>
  </section>
</div>
<script>
/* ---- petite boîte à outils SVG pour le chapitre 5 (cercle et disque) ---- */
const GEO=(function(){
const rad=d=>d*Math.PI/180, n=x=>Math.round(x*100)/100;
const pol=(cx,cy,r,deg)=>[cx+r*Math.cos(rad(deg)),cy-r*Math.sin(rad(deg))];
const norm=a=>((a%360)+360)%360;
function line(x1,y1,x2,y2,col,w,extra){return `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${col||'var(--ink)'}" stroke-width="${w||3}" stroke-linecap="round" ${extra||''}/>`;}
function circ(cx,cy,r,o){o=o||{};return `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" fill="${o.fill||'none'}" stroke="${o.col===undefined?'var(--ink)':o.col}" stroke-width="${o.w===undefined?3:o.w}" ${o.extra||''}/>`;}
/* arc de cercle parcouru dans le sens inverse des aiguilles d'une montre, de a1 à a2 (degrés) */
function arc(cx,cy,r,a1,a2,col,w,extra){const p1=pol(cx,cy,r,a1),p2=pol(cx,cy,r,a2);const d=norm(a2-a1);return `<path d="M${n(p1[0])} ${n(p1[1])} A${n(r)} ${n(r)} 0 ${d>180?1:0} 0 ${n(p2[0])} ${n(p2[1])}" fill="none" stroke="${col}" stroke-width="${w||5}" stroke-linecap="round" ${extra||''}/>`;}
function cross(x,y,col,s,w){s=s||6;return `<path d="M${n(x-s)} ${n(y-s)}L${n(x+s)} ${n(y+s)}M${n(x-s)} ${n(y+s)}L${n(x+s)} ${n(y-s)}" stroke="${col||'var(--ink)'}" stroke-width="${w||2.4}" fill="none" stroke-linecap="round"/>`;}
function dot(x,y,r,col){return `<circle cx="${n(x)}" cy="${n(y)}" r="${r||5}" fill="${col||'var(--ink)'}"/>`;}
function text(x,y,t,o){o=o||{};return `<text x="${n(x)}" y="${n(y)}" text-anchor="${o.anchor||'middle'}" font-family="Space Mono, monospace" font-weight="${o.weight||700}" font-size="${o.size||19}" fill="${o.col||'var(--ink)'}" ${o.halo?'stroke="var(--panel)" stroke-width="6" paint-order="stroke" stroke-linejoin="round"':''} ${o.extra||''}>${t}</text>`;}
/* étiquette placée autour du cercle de centre (cx,cy), dans la direction deg */
function lab(cx,cy,r,deg,t,o){o=o||{};const p=pol(cx,cy,r+(o.gap||24),deg);return text(p[0],p[1]+(o.dy===undefined?7:o.dy),t,o);}
function grid(W,H,step,ox,oy,col){let s='';for(let x=ox%step;x<=W;x+=step)s+=line(x,0,x,H,col||'var(--grid)',1);for(let y=oy%step;y<=H;y+=step)s+=line(0,y,W,y,col||'var(--grid)',1);return s;}
const fmt1=x=>(Math.round(x*10)/10).toString().replace('.',',');
return {rad,n,pol,norm,line,circ,arc,cross,dot,text,lab,grid,fmt1};
})();

(function(){
const {$,$$,pick,rnd,shuffle,seg,store,Teams,fmt}=L4;
const G=GEO,PI3=3.14,cx=260,cy=200;
const f2=x=>fmt(Math.round(x*100)/100,2);
let niv=+store.get('c5g3niv',1),vue=store.get('c5g3vue','oui'),tab='course',q=null,answered=false,score=[0,0];
const teams=Teams($('#teams'));teams.settings($('#set'));

/* figure : le cercle (en ambre quand on cherche son tour) avec son diamètre ou son rayon */
function figCircle(R,x,y,mode,label){
  let s=G.circ(x,y,R,{w:mode==='tour'?8:4,col:mode==='tour'?'var(--amber)':'var(--ink)',fill:'var(--fill-2)',extra:'fill-opacity=".45"'});
  if(mode==='tour'){
    const a=label==='r'?0:180;
    const p=G.pol(x,y,R,a),p2=G.pol(x,y,R,0);
    if(label==='r'){s+=G.line(x,y,p2[0],p2[1],'var(--ink)',3);s+=G.cross(p2[0],p2[1],'var(--ink)',7,3);}
    else{s+=G.line(p[0],p[1],p2[0],p2[1],'var(--blue)',4);s+=G.cross(p[0],p[1],'var(--ink)',7,3)+G.cross(p2[0],p2[1],'var(--ink)',7,3);}
  }
  s+=G.cross(x,y,'var(--ink)',7,3);
  return s;
}
function ropePath(){
  return `<path d="M330 300C360 220 395 340 425 250S470 170 495 120" fill="none" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/><path d="M330 300C360 220 395 340 425 250S470 170 495 120" fill="none" stroke="#c99a5a" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"/>`;
}

function newQ(){
  const kind=niv===3?'qcm':pick(['rope','qcm']);
  if(kind==='rope'){
    let d,L,P;
    if(niv===1){
      const f=pick([2,3,3,4,3.5]);d=f===3.5?pick([2,4,6,8]):rnd(2,9);L=f*d;
    }else{
      d=rnd(3,12);L=Math.round(pick([3.1,3.2])*d*100)/100;
    }
    P=PI3*d;const long=L>P;
    q={kind,ans:long?'long':'court',opts:[{v:'court',label:'Trop courte'},{v:'long',label:'Assez longue'}],
       ask:'La ficelle peut-elle faire le tour du cercle ?',data:`diamètre = ${fmt(d)} cm · ficelle = ${f2(L)} cm`,
       why:`Le tour mesure environ 3,14 × ${fmt(d)} = ${f2(P)} cm. La ficelle mesure ${f2(L)} cm : ${long?'elle est plus longue, elle suffit.':'elle est plus courte, elle ne suffit pas.'}`};
    q.svg=`<svg viewBox="0 0 520 400" role="img" aria-label="un cercle et une ficelle">`+figCircle(115,170,200,'plain')+G.line(55,200,285,200,'var(--blue)',4)+G.cross(55,200,'var(--ink)',7,3)+G.cross(285,200,'var(--ink)',7,3)+G.text(170,182,'d',{size:24,col:'var(--blue)',halo:true})+ropePath()+G.text(430,340,'ficelle',{size:20,col:'#8a5a2b'})+`</svg>`;
  }else{
    let d,r=null,opts,ans;
    if(niv===1){d=pick([2,3,4,5,6,8,10]);opts=[[2*d,'x'],[PI3*d,'ok'],[4*d,'x']];}
    else if(niv===2){d=pick([2.5,3,4.5,5,7.5,9]);opts=[[3*d,'x'],[PI3*d,'ok'],[3.5*d,'x']];}
    else{r=pick([2,3,4,5,6,7.5,9]);d=2*r;opts=[[PI3*r,'x'],[PI3*d,'ok'],[PI3*d*2,'x']];}
    opts=shuffle(opts).map(([v,k],i)=>({v:String(i),label:f2(v)+' cm',k}));
    ans=opts.find(o=>o.k==='ok').v;
    q={kind,ans,opts,ask:'Quel est le périmètre du cercle, environ ?',
       data:r!==null?`rayon = ${fmt(r)} cm`:`diamètre = ${fmt(d)} cm`,
       why:(r!==null?`Le diamètre est 2 × ${fmt(r)} = ${fmt(d)} cm. `:'')+`Le périmètre est environ 3,14 × ${fmt(d)} = ${f2(PI3*d)} cm.`};
    q.svg=`<svg viewBox="0 0 520 400" role="img" aria-label="un cercle dont on cherche le tour">`+figCircle(130,cx,cy,'tour',r!==null?'r':'d')+(r!==null?G.text(cx+65,cy-12,'r',{size:24,halo:true}):G.text(cx,cy-12,'d',{size:24,col:'var(--blue)',halo:true}))+G.text(cx,cy+170,'tour = ?',{size:22,col:'var(--amber-ink)'})+`</svg>`;
  }
  $('#fig').innerHTML=q.svg;$('#fig').hidden=vue!=='oui';
  $('#data').textContent=q.data;$('#ask').textContent=q.ask;
  answered=false;
  if(tab==='course'){
    for(let i=0;i<3;i++){teams.slot(i).innerHTML=`<select class="pick" data-ti="${i}" aria-label="réponse des ${teams.name(i)}"><option value="">Choisir…</option>${q.opts.map(o=>`<option value="${o.v}">${o.label}</option>`).join('')}</select>`;teams.res(i,'');}
    $('#cmsg').textContent='';
  }else{
    $('#soloch').innerHTML=q.opts.map(o=>`<button class="btn" data-a="${o.v}">${o.label}</button>`).join('');$('#smsg').textContent='';
  }
}
const lab=v=>q.opts.find(o=>o.v===v).label;
$('#corr').addEventListener('click',()=>{
  if(answered)return;answered=true;
  for(let i=0;i<3;i++){const el=teams.slot(i).querySelector('select'),v=el.value,ok=v===q.ans;el.classList.add(ok?'ok':'ko');
    if(ok){teams.add(i,1);teams.res(i,'Juste ! +1',true);}else teams.res(i,v?'Faux':'Pas de réponse',false);}
  $('#cmsg').className='msg';$('#cmsg').innerHTML=`Réponse : <span class="num">${lab(q.ans)}</span>. ${q.why}`;
});
$('#nextC').addEventListener('click',newQ);
$('#soloch').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||answered)return;answered=true;const ok=b.dataset.a===q.ans;score[1]++;if(ok)score[0]++;
  $('#smsg').className='msg '+(ok?'ok':'ko');$('#smsg').innerHTML=(ok?'Juste ! ':'Non. ')+`Réponse : ${lab(q.ans)}. ${q.why}`;$('#sscore').textContent=score[0]+' / '+score[1];});
$('#snext').addEventListener('click',newQ);
L4.tabs($('#tabs'),t=>{tab=t;newQ();})('course');
seg($('#niv'),v=>{niv=+v;store.set('c5g3niv',niv);newQ();},niv);
seg($('#vue'),v=>{vue=v;store.set('c5g3vue',v);$('#fig').hidden=v!=='oui';},vue);
})();
</script>
