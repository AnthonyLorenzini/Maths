<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les maths de M. Lorenzini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une feuille de cahier à carreaux ; trois « classeurs » de niveau
   avec l'étiquette penchée des fiches de séance ; tout se navigue par #ancre. */
:root{
  --papier:#F3EEE4; --feuille:#FFFFFF; --encre:#22303F; --gris:#5F6F80; --trait:#DDD5C6;
  --carreau:rgba(43,108,176,.10); --surligne:#FFD75E; --survol:#F1ECE2;
  --vert:#1E7A4C; --vert-clair:#E6F5EC; --vert-bord:#4CAF7D;
  --orange:#A45C06; --orange-clair:#FDF0DE; --orange-bord:#F0B25B;
  --violet:#5B21B6; --violet-clair:#F1EAFB; --violet-bord:#8B5CF6;
  --bleu:#2B6CB0; --bleu-clair:#EAF1FB;
  --ombre:0 10px 28px rgba(34,48,63,.10);
  --f-titre:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-texte:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papier:#161B22; --feuille:#202833; --encre:#ECE6DA; --gris:#9DAAB7; --trait:#344150;
  --carreau:rgba(140,175,220,.07); --surligne:#FFD75E; --survol:#2A3441;
  --vert:#6BD3A0; --vert-clair:#18342A; --vert-bord:#3F9C6E;
  --orange:#F4B866; --orange-clair:#3A2B16; --orange-bord:#C98A33;
  --violet:#BFA4FB; --violet-clair:#2B2242; --violet-bord:#8B5CF6;
  --bleu:#86B6EA; --bleu-clair:#1C2A3B; --ombre:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#161B22; --feuille:#202833; --encre:#ECE6DA; --gris:#9DAAB7; --trait:#344150;
  --carreau:rgba(140,175,220,.07); --surligne:#FFD75E; --survol:#2A3441;
  --vert:#6BD3A0; --vert-clair:#18342A; --vert-bord:#3F9C6E;
  --orange:#F4B866; --orange-clair:#3A2B16; --orange-bord:#C98A33;
  --violet:#BFA4FB; --violet-clair:#2B2242; --violet-bord:#8B5CF6;
  --bleu:#86B6EA; --bleu-clair:#1C2A3B; --ombre:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background-color:var(--papier);color:var(--encre);font:400 16px/1.55 var(--f-texte);
  background-image:linear-gradient(var(--carreau) 1px,transparent 1px),linear-gradient(90deg,var(--carreau) 1px,transparent 1px);
  background-size:22px 22px}
a{color:inherit}
.cadre{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
h1,h2,h3{font-family:var(--f-titre);line-height:1.1;text-wrap:balance;margin:0}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px;border-radius:6px}
#vue:focus{outline:none}

/* En-tête */
.entete{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.marque{display:flex;align-items:center;gap:12px;text-decoration:none}
.marque-badge{width:46px;height:46px;border-radius:12px;background:var(--encre);color:var(--surligne);
  font:800 24px/1 var(--f-titre);display:grid;place-items:center;transform:rotate(-5deg);flex:none}
.marque-nom{font:700 19px/1.05 var(--f-titre)}
.marque-nom small{display:block;font:500 12.5px/1.3 var(--f-texte);color:var(--gris)}
.raccourcis{display:flex;gap:6px;flex-wrap:wrap}
.raccourcis a{font:700 15px/1 var(--f-titre);text-decoration:none;padding:9px 14px 7px;border-radius:999px;border:2px solid var(--trait);background:var(--feuille)}
.raccourcis a:hover{border-color:var(--encre)}

/* Accueil */
.accroche{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:34px}
.accroche h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.01em}
.accroche h1 mark{background:linear-gradient(transparent 58%,var(--surligne) 58%,var(--surligne) 90%,transparent 90%);color:inherit;padding:0 .08em}
.accroche p{color:var(--gris);font-size:17px;margin:12px 0 0;max-width:46ch}
.recherche{background:var(--feuille);border:2px solid var(--encre);border-radius:16px;padding:14px;box-shadow:var(--ombre)}
.recherche label{display:block;font:700 15px/1.2 var(--f-titre);margin-bottom:8px}
.recherche-champ{display:flex;align-items:center;gap:8px;border:2px solid var(--trait);border-radius:12px;padding:0 12px;background:var(--papier)}
.recherche-champ:focus-within{border-color:var(--bleu)}
.recherche input{flex:1;min-width:0;border:0;background:transparent;color:var(--encre);font:500 16px/1 var(--f-texte);padding:12px 0;outline:none}
.exemples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--gris);align-items:center}
.exemples button{font:600 13px/1 var(--f-texte);padding:6px 10px;border-radius:999px;border:1.5px dashed var(--trait);background:transparent;color:var(--encre);cursor:pointer}
.exemples button:hover{border-style:solid;border-color:var(--encre)}
.reprendre{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bleu-clair);text-decoration:none;font-size:14px}
.reprendre b{font-family:var(--f-titre);font-size:15px}
.reprendre span{color:var(--gris)}

/* Classeurs de niveau */
.classeurs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:44px}
.classeur{position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;background:var(--feuille);
  border:2px solid var(--bord);border-radius:18px;padding:22px 20px 18px;box-shadow:var(--ombre);transition:transform .15s ease}
.classeur:hover{transform:translateY(-3px) rotate(-.4deg)}
.classeur::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;border-radius:16px 0 0 16px;
  background:repeating-linear-gradient(var(--bord) 0 6px,transparent 6px 22px);opacity:.55}
.classeur-haut{display:flex;align-items:center;gap:14px}
.etiquette{width:66px;height:66px;border-radius:16px;background:var(--encre);color:var(--clair-texte);font:800 28px/1 var(--f-titre);
  display:grid;place-items:center;transform:rotate(-5deg);flex:none}
.classeur h2{font-size:26px;color:var(--teinte)}
.classeur-haut p{margin:2px 0 0;color:var(--gris);font-size:14px;line-height:1.35}
.classeur ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px}
.classeur li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--trait)}
.classeur li span:last-child{color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
.classeur .ouvrir{margin-top:auto;font:700 16px/1 var(--f-titre);color:var(--teinte)}
.n-vert{--bord:var(--vert-bord);--teinte:var(--vert);--fond:var(--vert-clair);--clair-texte:#7EE2AC}
.n-orange{--bord:var(--orange-bord);--teinte:var(--orange);--fond:var(--orange-clair);--clair-texte:#FFD75E}
.n-violet{--bord:var(--violet-bord);--teinte:var(--violet);--fond:var(--violet-clair);--clair-texte:#D6C6FA}

.bloc{margin-bottom:44px}
.bloc>h2{font-size:26px;margin-bottom:14px}
.methode{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:etape;list-style:none;margin:0;padding:0}
.methode li{background:var(--feuille);border:2px solid var(--trait);border-radius:16px;padding:16px 18px;counter-increment:etape}
.methode li::before{content:counter(etape);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
  background:var(--surligne);color:#22303F;font:800 17px/1 var(--f-titre);margin-bottom:8px}
.methode h3{font-size:19px;margin-bottom:4px}
.methode p{margin:0;font-size:14.5px;color:var(--gris)}

/* Fils d'Ariane et en-têtes de vue */
.ariane{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--gris);margin-bottom:14px}
.ariane a{text-decoration:none;font-weight:600;color:var(--encre)}
.ariane a:hover{text-decoration:underline}
.vue-titre{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.vue-titre h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.vue-intro{color:var(--gris);max-width:62ch;margin:0 0 26px;font-size:16.5px}

/* Chapitres d'un niveau */
.chapitres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chapitre{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--feuille);border:2px solid var(--trait);
  border-radius:16px;padding:18px 20px;transition:border-color .15s}
.chapitre:hover{border-color:var(--teinte)}
.chapitre .num{font:700 13px/1 var(--f-texte);letter-spacing:.08em;text-transform:uppercase;color:var(--teinte)}
.chapitre h2{font-size:23px}
.chapitre p{margin:0;color:var(--gris);font-size:14.5px}
.compteurs{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.compteurs span{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--fond)}
.chapitre.bientot{opacity:.62;border-style:dashed;pointer-events:none}

/* Vue chapitre */
.conseil{display:flex;gap:12px;align-items:flex-start;background:var(--fond);border-radius:14px;padding:14px 16px;margin-bottom:28px;font-size:15px}
.conseil b{font-family:var(--f-titre);font-size:16px}
.rubrique{margin-bottom:30px}
.rubrique-tete{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--encre)}
.rubrique-tete h2{font-size:22px}
.rubrique-tete span{color:var(--gris);font-size:14px}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.carte{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--feuille);border:2px solid var(--trait);
  border-radius:14px;padding:14px 16px 16px;transition:transform .15s,border-color .15s;min-width:0}
.carte:hover{transform:translateY(-2px);border-color:var(--type)}
.carte-haut{display:flex;justify-content:space-between;gap:8px;align-items:center}
.type{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--type)}
.type::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--type)}
.neuf{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surligne);color:#22303F}
.carte h3{font-size:18.5px;font-weight:700}
.carte p{margin:0;font-size:14px;color:var(--gris)}
.carte .ou{font-size:12.5px;color:var(--gris);margin-top:2px}
.t-lecon{--type:var(--bleu)} .t-exos{--type:var(--vert)} .t-classe{--type:var(--orange)} .t-jeu{--type:var(--violet)} .t-plus{--type:var(--encre)}
.vide{border:2px dashed var(--trait);border-radius:14px;padding:16px 18px;color:var(--gris);font-size:14.5px;background:var(--feuille)}
.vide b{color:var(--encre)}

.resultats-tete{font:700 20px/1.2 var(--f-titre);margin:0 0 12px}
footer{margin-top:20px;padding-top:16px;border-top:1.5px dashed var(--trait);color:var(--gris);font-size:13.5px}

@media (max-width:860px){
  .accroche{grid-template-columns:1fr;gap:18px}
  .classeurs,.methode{grid-template-columns:1fr}
  .chapitres{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="cadre">
  <header class="entete">
    <a class="marque" href="#">
      <span class="marque-badge" aria-hidden="true">π</span>
      <span class="marque-nom" id="nom-site">Les maths de M. Lorenzini<small>Collège · 6e, 5e, 4e</small></span>
    </a>
    <nav class="raccourcis" id="raccourcis" aria-label="Niveaux"></nav>
  </header>
  <main id="vue" tabindex="-1"></main>
  <footer>Pas de nouveaux devoirs : à la maison, on refait les exercices déjà corrigés en classe. Les mini-jeux et les exercices en plus sont là pour ceux qui veulent s'entraîner davantage.</footer>
</div>

<script src="assets/catalogue.js"></script>
<script>
(function(){
  var S = window.SITE;
  var vue = document.getElementById('vue');
  var TYPES = {
    lecon:  {nom:'Leçon', rub:'La leçon', aide:'à relire avant les exercices'},
    classe: {nom:'En classe', rub:'Activités faites en classe', aide:'le support projeté pendant les séances'},
    exos:   {nom:'Exercices corrigés', rub:'Exercices corrigés', aide:'ceux faits en classe, à refaire chez toi'},
    jeu:    {nom:'Mini-jeu', rub:'Mini-jeux', aide:'pour t\'entraîner en t\'amusant'},
    plus:   {nom:'Pour s\'entraîner', rub:'Exercices en plus', aide:'des exercices nouveaux, tous corrigés'}
  };
  var ORDRE = ['lecon','classe','exos','jeu','plus'];
  var COUL = {vert:'n-vert', orange:'n-orange', violet:'n-violet'};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function lien(r){return 'pages/'+r.id+'/index.html';}
  function estNeuf(r){ if(!r.ajout) return false; var d=new Date(r.ajout+'T12:00:00'); return (Date.now()-d.getTime()) < 12*864e5; }
  function nomChap(c){ return (c.num ? 'Chapitre '+c.num : 'Hors chapitre'); }
  function trouver(id){
    for (var i=0;i<S.niveaux.length;i++){ var n=S.niveaux[i];
      if (n.id===id) return {niveau:n};
      for (var j=0;j<n.chapitres.length;j++) if (n.chapitres[j].id===id) return {niveau:n, chap:n.chapitres[j]};
    } return null;
  }
  function toutes(){
    var l=[]; S.niveaux.forEach(function(n){ n.chapitres.forEach(function(c){ c.ressources.forEach(function(r){ l.push({r:r,c:c,n:n}); }); }); }); return l;
  }
  function compte(c){ var o={}; c.ressources.forEach(function(r){ o[r.type]=(o[r.type]||0)+1; }); return o; }
  function pluriel(n,s,p){return n+' '+(n>1?p:s);}

  function carte(x, avecLieu){
    var r=x.r||x, t=TYPES[r.type]||TYPES.exos;
    return '<a class="carte t-'+esc(r.type)+'" href="'+lien(r)+'">'+
      '<div class="carte-haut"><span class="type">'+t.nom+'</span>'+(estNeuf(r)?'<span class="neuf">Nouveau</span>':'')+'</div>'+
      '<h3>'+esc(r.titre)+'</h3><p>'+esc(r.resume||'')+'</p>'+
      (avecLieu&&x.c?'<div class="ou">'+esc(x.n.nom)+' · '+esc(x.c.titre)+'</div>':'')+'</a>';
  }

  document.getElementById('raccourcis').innerHTML = S.niveaux.map(function(n){
    return '<a href="#'+n.id+'">'+esc(n.nom)+'</a>'; }).join('');

  /* ---------- Accueil ---------- */
  function accueil(){
    var der=null; try{ der=JSON.parse(localStorage.getItem('mathsLorenzini.derniere')||'null'); }catch(e){}
    var recents = toutes().filter(function(x){return x.r.ajout;})
      .sort(function(a,b){return a.r.ajout<b.r.ajout?1:-1;}).slice(0,6);
    vue.innerHTML =
      '<section class="accroche">'+
        '<div><h1>Tous tes cours de maths, <mark>au même endroit</mark>.</h1>'+
        '<p>'+esc(S.sousTitre)+' Choisis ton niveau, puis ton chapitre.</p></div>'+
        '<div class="recherche"><label for="q">Tu cherches quelque chose ?</label>'+
          '<div class="recherche-champ"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 12 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'+
          '<input id="q" type="search" placeholder="vitesse, fractions, nombres premiers…" autocomplete="off"></div>'+
          '<div class="exemples">Essaie : <button type="button">pourcentage</button><button type="button">décimaux</button><button type="button">mini-jeux</button></div>'+
          (der && der.id ? '<a class="reprendre" href="pages/'+esc(der.id)+'/index.html"><span>Reprendre</span><b>'+esc(der.titre)+'</b></a>' : '')+
        '</div>'+
      '</section>'+
      '<div id="resultats"></div>'+
      '<div id="sansrecherche">'+
      '<section class="classeurs" aria-label="Choisis ton niveau">'+ S.niveaux.map(function(n){
        var actifs=n.chapitres.filter(function(c){return !c.bientot;});
        return '<a class="classeur '+COUL[n.couleur]+'" href="#'+n.id+'">'+
          '<div class="classeur-haut"><span class="etiquette">'+esc(n.nom)+'</span><div><h2>Classe de '+esc(n.nom)+'</h2><p>'+esc(n.accroche)+'</p></div></div>'+
          '<ul>'+actifs.map(function(c){ return '<li><span>'+esc(c.titre)+'</span><span>'+pluriel(c.ressources.length,'page','pages')+'</span></li>'; }).join('')+'</ul>'+
          '<span class="ouvrir">Ouvrir le classeur →</span></a>';
      }).join('')+'</section>'+
      '<section class="bloc"><h2>Comment travailler un chapitre</h2><ol class="methode">'+
        '<li><h3>Relis la leçon</h3><p>Les fiches leçon ont des calculatrices : change les nombres pour vérifier que tu as compris.</p></li>'+
        '<li><h3>Refais les exercices corrigés</h3><p>Cherche d\'abord seul. Le bouton Astuce t\'aide si tu bloques, puis vérifie avec la Solution.</p></li>'+
        '<li><h3>Entraîne-toi en plus</h3><p>Les mini-jeux changent de nombres à chaque partie : tu peux y revenir autant de fois que tu veux.</p></li>'+
      '</ol></section>'+
      '<section class="bloc"><h2>Ajouté récemment</h2><div class="cartes">'+recents.map(function(x){return carte(x,true);}).join('')+'</div></section>'+
      '</div>';

    var q=document.getElementById('q'), res=document.getElementById('resultats'), sans=document.getElementById('sansrecherche');
    var tout=toutes();
    function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
    function chercher(){
      var v=norm(q.value.trim());
      if(!v){ res.innerHTML=''; sans.hidden=false; return; }
      var mots=v.split(/\s+/);
      var l=tout.filter(function(x){
        var t=norm([x.r.titre,x.r.resume,x.c.titre,x.c.resume,x.n.nom,(TYPES[x.r.type]||{}).nom].join(' '));
        return mots.every(function(m){ return t.indexOf(m)>-1 || (m==='mini-jeux'||m==='jeux') && x.r.type==='jeu'; });
      });
      sans.hidden=true;
      res.innerHTML = '<section class="bloc"><p class="resultats-tete">'+(l.length? pluriel(l.length,'page trouvée','pages trouvées') : 'Aucune page ne correspond')+'</p>'+
        (l.length? '<div class="cartes">'+l.map(function(x){return carte(x,true);}).join('')+'</div>' :
         '<div class="vide">Essaie un autre mot, par exemple le nom du chapitre, ou choisis ton niveau en haut de la page.</div>')+'</section>';
    }
    q.addEventListener('input',chercher);
    document.querySelectorAll('.exemples button').forEach(function(b){
      b.addEventListener('click',function(){ q.value=b.textContent; chercher(); q.focus(); });
    });
  }

  /* ---------- Niveau ---------- */
  function niveau(n){
    vue.innerHTML =
      '<nav class="ariane"><a href="#">Accueil</a><span>›</span><span>'+esc(n.nom)+'</span></nav>'+
      '<div class="vue-titre '+COUL[n.couleur]+'"><span class="etiquette">'+esc(n.nom)+'</span><h1>Classe de '+esc(n.nom)+'</h1></div>'+
      '<p class="vue-intro">'+esc(n.accroche)+'. Choisis un chapitre pour retrouver la leçon, les exercices corrigés et les mini-jeux.</p>'+
      '<div class="chapitres '+COUL[n.couleur]+'">'+n.chapitres.map(function(c){
        var k=compte(c);
        var chips=ORDRE.filter(function(t){return k[t];}).map(function(t){
          var nm={lecon:['leçon','leçons'],classe:['activité','activités'],exos:['exercices corrigés','exercices corrigés'],jeu:['mini-jeu','mini-jeux'],plus:['série en plus','séries en plus']}[t];
          return '<span>'+(t==='exos'? (k[t]>1? k[t]+' séries d\'exercices':'Exercices corrigés') : pluriel(k[t],nm[0],nm[1]))+'</span>';
        }).join('');
        return '<a class="chapitre'+(c.bientot?' bientot':'')+'" href="#'+c.id+'"'+(c.bientot?' aria-disabled="true" tabindex="-1"':'')+'>'+
          '<span class="num">'+nomChap(c)+'</span><h2>'+esc(c.titre)+'</h2><p>'+esc(c.resume||'')+'</p>'+
          '<div class="compteurs">'+(c.bientot?'<span>Bientôt en ligne</span>':chips)+'</div></a>';
      }).join('')+'</div>';
  }

  /* ---------- Chapitre ---------- */
  function chapitre(n,c){
    var k=compte(c);
    var rubs = ORDRE.filter(function(t){ return k[t] || t==='plus'; }).map(function(t){
      var items=c.ressources.filter(function(r){return r.type===t;});
      var corps = items.length ? '<div class="cartes">'+items.map(function(r){return carte(r);}).join('')+'</div>' :
        '<div class="vide"><b>Bientôt en ligne.</b> En attendant, refais les exercices corrigés de ce chapitre sans regarder la solution : c\'est le meilleur entraînement.</div>';
      return '<section class="rubrique"><div class="rubrique-tete"><h2>'+TYPES[t].rub+'</h2><span>'+TYPES[t].aide+'</span></div>'+corps+'</section>';
    }).join('');
    vue.innerHTML =
      '<nav class="ariane"><a href="#">Accueil</a><span>›</span><a href="#'+n.id+'">'+esc(n.nom)+'</a><span>›</span><span>'+nomChap(c)+'</span></nav>'+
      '<div class="'+COUL[n.couleur]+'">'+
        '<div class="vue-titre"><span class="etiquette">'+(c.num? 'Ch'+c.num : '★')+'</span><h1>'+esc(c.titre)+'</h1></div>'+
        '<p class="vue-intro">'+esc(c.resume||'')+'</p>'+
        (c.bientot ? '<div class="vide"><b>Ce chapitre arrive bientôt.</b> Les pages seront mises en ligne au fil des séances.</div>' :
        '<div class="conseil"><div><b>Par où commencer ?</b> Relis la leçon, refais les exercices corrigés sans regarder la solution, puis termine par un mini-jeu.</div></div>'+rubs)+
      '</div>';
  }

  function router(){
    var h=decodeURIComponent(location.hash.replace(/^#/,''));
    var t=h? trouver(h) : null;
    if(t && t.chap){ chapitre(t.niveau,t.chap); document.title=t.chap.titre+' · '+t.niveau.nom+' — '+S.titre; }
    else if(t){ niveau(t.niveau); document.title='Classe de '+t.niveau.nom+' — '+S.titre; }
    else { accueil(); document.title=S.titre; }
    if(h) { window.scrollTo(0,0); vue.focus({preventScroll:true}); }
  }
  window.addEventListener('hashchange',router);
  router();
})();
</script>
</body>
</html>
