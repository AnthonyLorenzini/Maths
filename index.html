<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les maths de M. Lorenzini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Jardin de fractales : fond clair et lumineux (thème clair uniquement, choisi), une fractale par niveau, la montgolfière en pied de page */
:root{
  color-scheme:light;
  --fond:#F6F8FD; --carte:#FFFFFF; --encre:#1B2333; --encre-2:#596379; --trait:#E0E5F0; --blanc:#FFFFFF;
  --vert:#0F9562; --vert-clair:#DDF6EA; --orange:#E8700F; --orange-clair:#FFEBD9; --violet:#6E4FE0; --violet-clair:#ECE6FF;
  --soleil:#FFC93C; --soleil-clair:#FFF4D1;
  --ciel-haut:#A9DCFF; --ciel-bas:#EEF8FF; --colline:#B9E3C9; --colline-2:#8FD0AA; --nuage:#FFFFFF;
  --f-titre:'Bricolage Grotesque','Arial Rounded MT Bold','Segoe UI',sans-serif;
  --f-texte:'Atkinson Hyperlegible',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-texte);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
.page{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-titre);font-weight:800;margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.2rem;font-weight:600}
p{margin:0}
strong{font-weight:700}
.eti{font-family:var(--f-titre);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.doux{color:var(--encre-2)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a,button{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--soleil);outline-offset:3px;border-radius:10px}
.vue{display:flex;flex-direction:column;gap:20px}
.c-vert{--c:var(--vert);--cc:var(--vert-clair)} .c-orange{--c:var(--orange);--cc:var(--orange-clair)} .c-violet{--c:var(--violet);--cc:var(--violet-clair)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-titre);font-weight:800;font-size:1.05rem;padding:13px 20px;border-radius:14px;background:var(--c,var(--vert));color:var(--blanc);text-decoration:none;box-shadow:0 4px 0 color-mix(in srgb,var(--c,var(--vert)) 65%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,var(--vert)) 65%,#000)}
.btn svg{width:20px;height:20px;flex:none}
.btn.jaune{--c:var(--soleil);color:#2A1E00}
.lien-texte{font-weight:700;color:var(--encre-2);text-decoration:underline;text-underline-offset:3px}
.retour{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--encre-2);padding:6px 0;width:fit-content}
.retour svg{width:18px;height:18px}

/* héros fractal */
.heros{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--violet-clair),var(--carte) 75%);border:1px solid var(--trait)}
.heros canvas{display:block;width:100%;height:260px}
.heros .txt{padding:4px 18px 18px;display:flex;flex-direction:column;gap:6px}
.legende{font-size:.85rem;color:var(--encre-2);font-style:italic}

.rejouer{position:absolute;top:12px;right:12px;z-index:2;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px;background:var(--carte);border:1px solid var(--trait);color:var(--encre-2)}
.bandeau > .rejouer{position:absolute;max-width:none}
.bandeau > canvas{display:block;width:100%;max-width:none;height:210px;margin-top:4px}

/* niveaux */
.niveaux{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.niv{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 16px;border-radius:20px;background:var(--carte);border:2px solid var(--cc);box-shadow:0 5px 0 var(--cc);transition:transform .1s,box-shadow .1s,border-color .15s;min-width:0;text-align:center}
.niv:hover{border-color:var(--c)}
.niv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cc)}
.niv svg{width:64px;height:64px}
.niv .gros{font-family:var(--f-titre);font-weight:800;font-size:2rem;line-height:1;color:var(--c)}
.niv .info{font-size:.8rem;line-height:1.3;color:var(--encre-2)}
.frac{fill:var(--c);stroke:none}
.frac-trait{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linejoin:round}

/* énigme */
.enigme{border-radius:20px;padding:16px;background:var(--soleil-clair);border:2px dashed var(--soleil);display:flex;flex-direction:column;gap:10px}
.enigme .q{font-size:1.08rem;font-weight:700}
.enigme .rep{padding:10px 12px;border-radius:12px;background:var(--carte);font-weight:700}
/* archive des énigmes : les 7 jours précédents, réponse cachée */
.archive{display:flex;flex-direction:column;gap:8px}
.eg{border:2px solid var(--trait);border-radius:14px;background:var(--carte)}
.eg summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;gap:3px}
.eg summary::-webkit-details-marker{display:none}
.eg .ed{font-family:var(--f-titre);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--encre-2)}
.eg .eq{font-weight:700}
.eg .er{font-weight:700;color:var(--violet);font-size:.92rem}
.eg[open] .er{display:none}
.eg .ea{padding:0 14px 14px;font-weight:700}
/* code de sauvegarde de la montgolfière */
.sauv{--c:var(--violet);display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--carte);border:2px solid var(--trait)}
.sauv .code{font-family:var(--f-texte);font-weight:700;font-size:1.5rem;letter-spacing:.14em;padding:12px 14px;border-radius:12px;background:var(--fond);border:2px dashed var(--encre-2);text-align:center;user-select:all}
.sauv .rang{display:flex;gap:8px;flex-wrap:wrap}
.sauv input{flex:1 1 160px;min-width:0;font:inherit;font-size:.95rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:11px 12px;border:2px solid var(--trait);border-radius:12px;background:var(--carte);color:var(--encre)}
.sauv hr{border:0;border-top:2px solid var(--trait);margin:0;width:100%}
.sauv .etat{font-size:.92rem;min-height:1.3em}
.btn.mini{padding:10px 14px;font-size:.95rem}
.btn.clair{background:var(--carte);color:var(--encre);border:2px solid var(--encre);box-shadow:0 4px 0 var(--trait)}
/* fiche de révision à imprimer */
.fiche-ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sans-ecran{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--soleil-clair);font-size:.85rem;font-weight:700}
#fiche-a4{display:none}
@media print{
 @page{size:A4;margin:14mm}
 body.imprime-fiche{background:#fff;padding:0;color:#000}
 body.imprime-fiche>*:not(#fiche-a4){display:none!important}
 body.imprime-fiche #fiche-a4{display:flex;flex-direction:column;gap:12px;color:#000;background:#fff;font-size:11.5pt;line-height:1.4}
 #fiche-a4 .tete{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px}
 #fiche-a4 .tete .t{font-family:var(--f-titre);font-weight:800;font-size:15pt;line-height:1.1}
 #fiche-a4 .tete .t span{font-weight:600;font-size:11.5pt}
 #fiche-a4 .tete .n{font-size:10.5pt;text-align:right;white-space:nowrap}
 #fiche-a4 .fs{break-inside:avoid;display:flex;flex-direction:column;gap:4px;padding-top:2px}
 #fiche-a4 .fs h4{margin:0;font-family:var(--f-titre);font-size:12.5pt;font-weight:800;display:flex;gap:8px;align-items:center}
 #fiche-a4 .fs h4 span{display:grid;place-items:center;width:20px;height:20px;border:1.5px solid #000;border-radius:50%;font-size:10pt;flex:none}
 #fiche-a4 .fs ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
 #fiche-a4 .fex{margin:0;padding-left:22px;font-style:italic}
 #fiche-a4 .fsv{margin:0;padding-left:22px;display:flex;gap:8px;align-items:flex-start}
 #fiche-a4 .box{flex:none;width:13px;height:13px;border:1.5px solid #000;margin-top:4px}
 #fiche-a4 .pied{border-top:1px solid #000;padding-top:6px;font-size:10pt;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
}

/* bandeau de niveau / chapitre */
.bandeau{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;background:var(--cc);display:flex;flex-direction:column;gap:6px;min-height:110px}
.bandeau > *{position:relative;max-width:72%}
.bandeau .gros{font-family:var(--f-titre);font-weight:800;font-size:3rem;line-height:.95;color:var(--c)}
.bandeau .eti{color:var(--c)}
.bandeau .deco{position:absolute;right:-14px;bottom:-14px;width:130px;height:130px;opacity:.35;max-width:none}

.chapitres{display:flex;flex-direction:column;gap:12px}
.chap{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--carte);border:2px solid var(--trait);transition:border-color .15s,transform .15s}
.chap:hover:not([aria-disabled="true"]){border-color:var(--c);transform:translateY(-2px)}
.chap[aria-disabled="true"]{cursor:default;opacity:.55;border-style:dashed}
.chap .haut{display:flex;align-items:center;gap:12px}
.num{width:42px;height:42px;flex:none;border-radius:12px;background:var(--cc);color:var(--c);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:1.25rem}
.chap .t{font-family:var(--f-titre);font-weight:800;font-size:1.15rem;line-height:1.15}
.chap .s{font-size:.92rem;color:var(--encre-2)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--fond);color:var(--encre-2)}
.puce.jeu{background:var(--soleil-clair);color:var(--encre)}
.puce svg{width:14px;height:14px}

/* chapitre */
.choix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choix.seul{grid-template-columns:1fr}
.choix .btn{width:100%}
.seance{border-radius:20px;background:var(--carte);border:1px solid var(--trait);overflow:hidden}
.seance .tete{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--cc)}
.seance .tete .num{background:var(--c);color:var(--blanc)}
.seance .tete .eti{color:var(--c)}
.seance .corps{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.etape{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.etape .rond{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fond);color:var(--c)}
.etape .rond svg{width:16px;height:16px}
.etape .cont{min-width:0;display:flex;flex-direction:column;gap:8px}
.etape .cont > .eti{color:var(--encre-2);padding-top:6px}
.lien{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--encre);text-decoration:none;padding:11px 14px;border:2px solid var(--trait);border-radius:12px;background:var(--carte)}
.lien:hover{border-color:var(--c);color:var(--c)}
.lien svg{width:18px;height:18px;flex:none}
.lien .fl{margin-left:auto;color:var(--encre-2);white-space:nowrap}
.lien.jeu{background:var(--soleil-clair);border-color:var(--soleil)}
.lien.jeu .fl{color:var(--orange)}
.retenir{border-radius:12px;padding:12px 14px;background:var(--fond);border-left:5px solid var(--c)}
.retenir ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.retenir .ex{margin-top:8px;font-style:italic;color:var(--encre-2)}
.liens{display:flex;flex-direction:column;gap:8px}
.jeux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.carte-jeu{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--carte);border:2px solid var(--trait);text-decoration:none;color:var(--encre);min-width:0;transition:border-color .15s,transform .15s}
.carte-jeu:hover{border-color:var(--soleil);transform:translateY(-2px)}
.carte-jeu .ico{width:36px;height:36px;border-radius:50%;background:var(--soleil);color:#2A1E00;display:grid;place-items:center}
.carte-jeu .ico svg{width:18px;height:18px}
.carte-jeu .t{font-family:var(--f-titre);font-weight:800;font-size:1rem;line-height:1.15}
.carte-jeu .s{font-size:.82rem;color:var(--encre-2)}
.carte-jeu .gain{font-size:.8rem;font-weight:700;color:var(--orange)}
@media (max-width:380px){.jeux{grid-template-columns:1fr}.niv svg{width:52px;height:52px}.niv .gros{font-size:1.7rem}}

/* montgolfière (pied de page) */
.vol{border-radius:24px;overflow:hidden;background:var(--carte);border:1px solid var(--trait)}
.vol svg{display:block;width:100%;height:auto}
.vol .infos{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.alt{font-family:var(--f-titre);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.alt small{font-size:1.05rem;color:var(--encre-2);font-weight:600}
.ligne{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.jauge{height:12px;border-radius:999px;background:var(--fond);border:1px solid var(--trait);overflow:hidden}
.jauge span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--soleil),var(--orange))}
.palier-txt{font-size:.95rem;color:var(--encre-2)}
.palier-txt strong{color:var(--encre)}
.pseudo{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:999px;background:var(--soleil-clair);color:var(--encre)}
svg .ciel1{stop-color:var(--ciel-haut)} svg .ciel2{stop-color:var(--ciel-bas)}
svg .nuage{fill:var(--nuage)} svg .colline{fill:var(--colline)} svg .colline2{fill:var(--colline-2)}
svg .repere{stroke:var(--encre-2);stroke-width:1;stroke-dasharray:3 5;opacity:.35}
svg .lbl{font-family:var(--f-texte);font-weight:700;font-size:13px;fill:var(--encre-2)}
svg .soleil{fill:var(--soleil)}
/* paliers collectionnés */
.coll{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.coll .slot{aspect-ratio:1;border-radius:8px;background:var(--fond);border:1px solid var(--trait);display:grid;place-items:center;color:var(--encre-2);font-weight:800;font-size:.75rem;overflow:hidden}
.coll .slot.ok{background:#fff;border-color:var(--violet)}
.coll .slot.cur{outline:2px dashed var(--orange);outline-offset:1px}
.coll .slot svg{width:100%;height:100%;display:block}
svg .corde{stroke:#6B4A2B;stroke-width:1.4}
svg .nacelle{fill:#A9733F}
.note{font-size:.85rem;color:var(--encre-2);text-align:center}

/* fenêtre pseudo, notification */
.voile{position:fixed;inset:0;background:color-mix(in srgb,#1B2333 40%,transparent);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
.fenetre{width:100%;max-width:440px;background:var(--carte);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.fenetre label{font-weight:700}
.fenetre input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--trait);background:var(--fond);color:var(--encre);width:100%}
.erreur{font-size:.9rem;font-weight:700;color:var(--orange)}
.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--carte);color:var(--encre);border:2px solid var(--soleil);box-shadow:0 8px 24px color-mix(in srgb,#1B2333 15%,transparent);padding:12px 18px;border-radius:16px;font-weight:700;z-index:11;max-width:calc(100% - 32px)}
.toast b{color:var(--orange)}

/* animations */
.anim .a-haut{animation:descend .5s ease-out backwards}
.anim .a-monte{animation:monte .45s ease-out backwards}
.anim .a-pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) backwards}
.anim .decolle{animation:decolle 1.6s .3s cubic-bezier(.3,.7,.3,1) backwards}
.flotte{animation:flotte 4s ease-in-out infinite}
.anim .jauge span{animation:remplit 1.3s .4s cubic-bezier(.3,.7,.3,1) backwards}
.toast{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes descend{from{opacity:0;transform:translateY(-14px)}}
@keyframes monte{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes decolle{from{transform:translateY(var(--dy))}}
@keyframes flotte{50%{transform:translateY(-4px)}}
@keyframes remplit{from{width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
a.niv,a.chap,a.reprendre{text-decoration:none;color:inherit}
.res{display:flex;flex-direction:column;min-width:0}
.res small{color:var(--encre-2);font-weight:400;font-size:.82rem;line-height:1.3}
.lien .neuf,.carte-jeu .neuf{flex:none}
.neuf{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--soleil);color:#2A1E00;white-space:nowrap}
.recherche{display:flex;flex-direction:column;gap:10px}
.recherche label{font-family:var(--f-titre);font-weight:800;font-size:1.15rem}
.champ{display:flex;align-items:center;gap:10px;border:2px solid var(--trait);border-radius:14px;padding:0 14px;background:var(--carte)}
.champ:focus-within{border-color:var(--violet)}
.champ svg{width:18px;height:18px;color:var(--encre-2);flex:none}
.champ input{flex:1;min-width:0;border:0;background:transparent;color:var(--encre);font:inherit;padding:13px 0;outline:none}
.reprendre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--soleil-clair);border:2px solid var(--soleil)}
.reprendre span{color:var(--encre-2);font-weight:700}
.reprendre strong{font-family:var(--f-titre)}
.savoir{margin-top:8px;font-weight:700}
.savoir strong{font-family:var(--f-titre);color:var(--c);margin-right:4px}
.deroule{font-size:.95rem;color:var(--encre-2)}
.deroule summary{cursor:pointer;font-weight:700;padding:4px 0}
.deroule ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bandeau .doux{max-width:72%}

/* onglets d'une classe */
.onglets{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:var(--cc)}
.onglets a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:13px;text-decoration:none;color:var(--c);font-family:var(--f-titre);font-weight:800}
.onglets a.on{background:var(--carte);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.onglets svg{width:18px;height:18px;flex:none}
/* onglet Évaluations */
.onglets.trois{grid-template-columns:repeat(3,1fr)}
.onglets.trois a{font-size:.86rem;gap:5px;padding:12px 2px}
.onglets:not(.trois){grid-template-columns:1fr 1fr}
.onglets.quatre{grid-template-columns:repeat(4,1fr)}
.onglets.quatre a{flex-direction:column;gap:3px;font-size:.78rem;padding:10px 2px}
/* onglet Leçon : lien + QR code */
.commune{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--carte);border:2px solid var(--c);box-shadow:0 4px 0 var(--cc)}
.commune h2{font-size:1.15rem;margin:0}
.commune p{margin:4px 0 12px}
.commune .btn{width:100%}
.commune .qr{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--encre-2);text-align:center}
.commune .qr img{width:112px;height:112px;border:1px solid var(--trait);border-radius:10px;background:#fff;image-rendering:pixelated}
@media(max-width:420px){.commune{grid-template-columns:1fr}.commune .qr{order:-1}.commune .qr img{width:140px;height:140px}}
.eval{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--carte);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 25%,transparent)}

.eval .versions{display:flex;flex-direction:column;gap:8px;margin-top:4px}

.eval .boutons{display:flex;flex-wrap:wrap;gap:8px}
.btn-pdf{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;font-weight:800;text-decoration:none;border:2px solid var(--c);color:var(--c);background:var(--carte)}
.btn-pdf.sujet{background:var(--c);color:#fff}
.lien .fl svg{width:18px;height:18px;display:block}
.lien .num{width:34px;height:34px;border-radius:10px;font-size:1.05rem;flex:none}
.lien.off{opacity:.55;border-style:dashed;cursor:default}
.lien.off:hover{border-color:var(--trait);color:var(--encre)}

/* scène de l'ascension */
svg .lbl{paint-order:stroke;stroke:rgba(255,255,255,.72);stroke-width:3px;stroke-linejoin:round}
svg .lbl.ok{fill:var(--encre);font-weight:800}
svg .rep-i{color:#8A95A8} svg .rep-i.ok{color:var(--c,var(--violet))}
svg .plafond{stroke:var(--orange);stroke-width:1.6;stroke-dasharray:6 5}
svg .pastille{fill:var(--orange)} svg .pastille-t{fill:#fff;font-family:var(--f-texte);font-weight:700;font-size:13px}
.pied-asc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--carte);border:1px solid var(--trait)}
.pied-asc svg.mini{width:46px;height:50px;flex:none}
.pied-asc .alt{font-size:1.7rem}
.zone{font-weight:700;color:var(--encre-2);margin-top:2px}
.pied-asc .btn{margin-left:auto;padding:10px 18px;flex:none}

/* test d'ascension */
.test{display:flex;flex-direction:column;gap:16px}
.t-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.progres{display:flex;gap:6px}
.progres i{flex:1;height:10px;border-radius:999px;background:var(--trait)}
.progres i.v{background:var(--vert)} .progres i.f{background:var(--orange)} .progres i.c{background:var(--carte);box-shadow:inset 0 0 0 3px var(--c)}
.enonce{font-size:1.15rem;font-weight:700;line-height:1.45;padding:16px;border-radius:18px;background:var(--carte);border:2px solid var(--trait)}
.enonce p{margin:12px 0 0}
.tab{border-collapse:collapse;margin:2px 0;font-variant-numeric:tabular-nums;max-width:100%}
.tab th,.tab td{border:2px solid var(--trait);padding:8px 12px;text-align:center;font-weight:700}
.tab th{background:var(--cc);color:var(--c);text-align:left;font-family:var(--f-titre)}
.reps{display:flex;flex-direction:column;gap:10px}
.rep{display:flex;gap:12px;align-items:center;min-height:56px;padding:12px 16px;border-radius:16px;background:var(--carte);border:2px solid var(--trait);font-weight:700;font-size:1.05rem;line-height:1.3;transition:border-color .12s,transform .08s,background .12s}
.rep:hover:not(:disabled){border-color:var(--c)} .rep:active:not(:disabled){transform:translateY(2px)}
.rep .lettre{width:32px;height:32px;border-radius:50%;background:var(--cc);color:var(--c);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;flex:none}
.rep.bonne{border-color:var(--vert);background:var(--vert-clair)} .rep.bonne .lettre{background:var(--vert);color:#fff}
.rep.faux{border-color:var(--orange);background:var(--orange-clair)} .rep.faux .lettre{background:var(--orange);color:#fff}
.rep:disabled{cursor:default}
.correction{display:flex;flex-direction:column;gap:10px}

.verdict{font-size:1.1rem}

<script>

const S=window.SITE;
const REDUIT=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICO={

 jeu:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>',

 classe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18v12H3Z"/><path d="M8 20h8M12 16v4"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 imprimer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M6 14h12v7H6z"/></svg>',
 retenir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>',

 monte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V6M6 12l6-6 6 6"/></svg>'
};

/* ---------- Fractales : une par niveau ---------- */
// 6e : triangle de Sierpinski
function sierpinski(){let t='';(function f(x,y,s,n){if(!n){t+=`M${x} ${y}l${s/2} ${-s*.866}l${s/2} ${s*.866}Z`;return}const h=s/2;f(x,y,h,n-1);f(x+h,y,h,n-1);f(x+h/2,y-h*.866,h,n-1)})(4,90,92,4);
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><path class="frac" d="${t}"/></svg>`}
// 5e : flocon de Koch
function koch(){let p=[[50,6],[88,72],[12,72]];for(let k=0;k<3;k++){const q=[];for(let i=0;i<p.length;i++){const[a,b]=p[i],[c,d]=p[(i+1)%p.length],dx=(c-a)/3,dy=(d-b)/3;const A=[a+dx,b+dy],B=[a+2*dx,b+2*dy],C=[A[0]+dx*.5+dy*.866,A[1]+dy*.5-dx*.866];q.push([a,b],A,C,B)}p=q}
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><path class="frac" style="opacity:.25" d="M${p.map(x=>x[0].toFixed(1)+' '+x[1].toFixed(1)).join('L')}Z"/><path class="frac-trait" d="M${p.map(x=>x[0].toFixed(1)+' '+x[1].toFixed(1)).join('L')}Z"/></svg>`}
// 4e : arbre de Pythagore
function arbre(){let t='';(function f(x,y,ux,uy,n){const vx=uy,vy=-ux;t+=`M${x.toFixed(1)} ${y.toFixed(1)}l${ux.toFixed(1)} ${uy.toFixed(1)}l${vx.toFixed(1)} ${vy.toFixed(1)}l${(-ux).toFixed(1)} ${(-uy).toFixed(1)}Z`;if(!n)return;const px=x+vx,py=y+vy,ax=px+(ux+vx)/2,ay=py+(uy+vy)/2;f(px,py,ax-px,ay-py,n-1);f(ax,ay,px+ux-ax,py+uy-ay,n-1)})(42,96,16,0,7);
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><path class="frac" d="${t}"/></svg>`}
const FRAC={'6e':sierpinski,'5e':koch,'4e':arbre};
const frac=id=>(FRAC[id]||sierpinski)();

/* ---------- Fractales tracées en canvas, lentement (on les voit pousser) ---------- */
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
function rgbDe(s){s=(s||'').trim();let m=/^#([0-9a-f]{6})$/i.exec(s);if(m){const n=parseInt(m[1],16);return[n>>16,(n>>8)&255,n&255]}m=/(\d+)[ ,]+(\d+)[ ,]+(\d+)/.exec(s);return m?[+m[1],+m[2],+m[3]]:[110,79,224]}
const mix=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
let animId=0,rejouerFn=null,redessiner=null;
function lancer(id,duree,tracer,sans){
 cancelAnimationFrame(animId);
 const cv=document.getElementById(id);if(!cv)return;
 const r=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=Math.round(W*r);cv.height=Math.round(H*r);
 const ctx=cv.getContext('2d');
 const dessin=p=>{ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,W,H);tracer(ctx,W,H,p,cv)};
 rejouerFn=()=>lancer(id,duree,tracer,false);redessiner=()=>lancer(id,duree,tracer,true);
 if(REDUIT||sans){dessin(1);return}
 const t0=performance.now();
 (function image(now){const p=Math.min(1,Math.max(0,(now-t0)/duree));dessin(p);if(p<1)animId=requestAnimationFrame(image)})(t0);
}

/* Mandelbrot : le point reste « dans l'ensemble » (violet) tant qu'on n'a pas vu qu'il s'échappe ; la forme apparaît quand le nombre d'itérations monte */
let MB=null;
const PAL_STOPS=[[0,[244,240,255]],[.2,[196,184,250]],[.4,[150,132,236]],[.6,[120,200,170]],[.8,[255,190,140]],[1,[255,214,110]]];
function calculerMandel(W,H){
 let sc=Math.max(2,window.devicePixelRatio||1);if(W*H*sc*sc>900000)sc=Math.max(1.2,Math.sqrt(900000/(W*H)));const w=Math.round(W*sc),h=Math.round(H*sc),MAXI=160;
 if(MB&&MB.w===w&&MB.h===h)return MB;
 const e=new Uint8Array(w*h).fill(255),ci=new Uint8Array(w*h),u=2.5/h,x0=-.55-w*u/2,y0=-1.25;
 for(let py=0;py<h;py++){const im=y0+py*u;for(let px=0;px<w;px++){
  const re=x0+px*u,q=(re-.25)*(re-.25)+im*im;
  if(q*(q+(re-.25))<.25*im*im||(re+1)*(re+1)+im*im<.0625)continue;
  let zr=0,zi=0,i=0,m=0,premier=0;
  for(;i<MAXI;i++){const t=zr*zr-zi*zi+re;zi=2*zr*zi+im;zr=t;m=zr*zr+zi*zi;if(!premier&&m>4)premier=i+1;if(m>256)break}
  if(i<MAXI){const mu=i+1-Math.log2(Math.log(m)/2);e[py*w+px]=premier||i+1;ci[py*w+px]=Math.min(255,Math.floor(Math.pow(Math.min(Math.max(mu,0),100)/100,.4)*255))}
 }}
 const pal=new Uint32Array(256);
 for(let i=0;i<256;i++){const v=i/255;let a=PAL_STOPS[0],b=PAL_STOPS[1];for(let j=0;j<PAL_STOPS.length-1;j++)if(v>=PAL_STOPS[j][0]){a=PAL_STOPS[j];b=PAL_STOPS[j+1]}
  const f=Math.min(1,(v-a[0])/(b[0]-a[0])),c=a[1].map((x,k)=>Math.round(x+(b[1][k]-x)*f));pal[i]=(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0]}
 const off=document.createElement('canvas');off.width=w;off.height=h;const octx=off.getContext('2d'),id=octx.createImageData(w,h);
 return MB={k:-1,w,h,e,ci,pal,MAXI,off,octx,id,D:new Uint32Array(id.data.buffer)};
}
function trMandel(ctx,W,H,p){
 const M=calculerMandel(W,H),k=Math.floor(1+M.MAXI*Math.pow(p,1.7)),{e,ci,pal,D}=M,DEDANS=(255<<24)|(190<<16)|(62<<8)|86;
 if(k!==M.k){M.k=k;for(let i=0;i<e.length;i++)D[i]=(e[i]!==255&&e[i]<=k)?pal[ci[i]]:DEDANS;M.octx.putImageData(M.id,0,0)}
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(M.off,0,0,W,H);
}

/* 6e : triangle de Sierpinski, on creuse les triangles niveau après niveau */
function trSierp(ctx,W,H,p,cv){
 const c=rgbDe(getComputedStyle(cv).getPropertyValue('--c')),MAXL=6,t=p*(MAXL+1);
 const S=Math.min(W*.92,(H-14)/.866),A=[W/2-S/2,H-8],B=[W/2+S/2,H-8],C=[W/2,H-8-S*.866];
 const tri=q=>{ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.closePath();ctx.fill()};
 const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],s0=ease(t);
 ctx.save();ctx.translate(W/2,H-8);ctx.scale(s0,s0);ctx.translate(-W/2,-(H-8));
 const g=ctx.createLinearGradient(0,C[1],0,A[1]);g.addColorStop(0,mix(c,[255,255,255],.4));g.addColorStop(1,mix(c,[0,0,0],0));ctx.fillStyle=g;tri([A,B,C]);ctx.restore();
 ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';
 (function trous(a,b,cc,l){const s=ease(t-l);if(s<=0||l>MAXL)return;const ab=mid(a,b),bc=mid(b,cc),ca=mid(cc,a),gx=(ab[0]+bc[0]+ca[0])/3,gy=(ab[1]+bc[1]+ca[1])/3;
  tri([ab,bc,ca].map(q=>[gx+(q[0]-gx)*s,gy+(q[1]-gy)*s]));trous(a,ab,ca,l+1);trous(ab,b,bc,l+1);trous(ca,bc,cc,l+1)})(A,B,C,1);
 ctx.globalCompositeOperation='source-over';
}

/* 5e : flocon de Koch, les pointes sortent de chaque côté, étape après étape */
function kochPas(P,s){const Q=[],n=P.length,r3=Math.sqrt(3)/2;for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],dx=(b[0]-a[0])/3,dy=(b[1]-a[1])/3,A1=[a[0]+dx,a[1]+dy];Q.push(a,A1,[A1[0]+dx/2+s*dy*r3,A1[1]+dy/2-s*dx*r3],[a[0]+2*dx,a[1]+2*dy])}return Q}
function trKoch(ctx,W,H,p,cv){
 const c=rgbDe(getComputedStyle(cv).getPropertyValue('--c')),NK=4,t=p*(NK+1),R=(H-20)/2,L=R*Math.sqrt(3),cx=W/2,cy=H/2+4;
 let P=[[cx,cy-R],[cx+L/2,cy+R/2],[cx-L/2,cy+R/2]];
 const tt=Math.max(0,t-1),k0=Math.min(NK,Math.floor(tt));
 for(let k=0;k<k0;k++)P=kochPas(P,1);
 if(k0<NK&&tt>0)P=kochPas(P,ease(tt-k0));
 const sc=ease(t);ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
 ctx.beginPath();P.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
 ctx.fillStyle=mix(c,[255,255,255],.55);ctx.fill();ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.strokeStyle=mix(c,[0,0,0],.05);ctx.stroke();ctx.restore();
}

/* 4e : arbre de Pythagore, une génération de carrés à la fois */
function trArbre(ctx,W,H,p,cv){
 const c=rgbDe(getComputedStyle(cv).getPropertyValue('--c')),PROF=10,t=p*(PROF+1),u=Math.min(W/6.4,(H-12)/4.15),k=Math.SQRT1_2,jaune=[255,201,60];
 ctx.translate(W/2-u/2,H-6);ctx.scale(u,u);
 (function br(dep){const s=ease(t-dep);if(s<=0)return;ctx.save();if(s<1){ctx.translate(.5,0);ctx.scale(s,s);ctx.translate(-.5,0)}
  ctx.fillStyle=mix(c,jaune,dep/PROF);ctx.fillRect(0,-1,1,1);ctx.restore();if(s<1||dep>=PROF)return;
  ctx.save();ctx.translate(0,-1);ctx.rotate(-Math.PI/4);ctx.scale(k,k);br(dep+1);ctx.restore();
  ctx.save();ctx.translate(.5,-1.5);ctx.rotate(Math.PI/4);ctx.scale(k,k);br(dep+1);ctx.restore()})(0);
}
const FRACTALES={'6e':[7000,trSierp],'5e':[7000,trKoch],'4e':[8500,trArbre]};

/* ---------- Énigmes du jour : 30 énigmes, une par jour, choisie d'après la date ---------- */
const ENIGMES=[
 ["Je suis un nombre à deux chiffres. Le produit de mes chiffres vaut 24 et leur somme vaut 11. Qui suis-je ?","38 ou 83 : 3 × 8 = 24 et 3 + 8 = 11."],
 ["Un escargot est au fond d'un puits de 10 m. Le jour il monte de 3 m, la nuit il glisse de 2 m. Quel jour sort-il du puits ?","Le 8e jour : au matin du 8e jour il est à 7 m, il monte de 3 m et atteint le bord."],
 ["Une brique pèse 1 kg plus la moitié d'une brique. Combien pèse une brique ?","2 kg : la demi-brique pèse 1 kg."],
 ["Combien de carrés de toutes tailles voit-on sur un quadrillage de 3 cases sur 3 ?","14 carrés : 9 petits, 4 moyens et 1 grand."],
 ["Une raquette et une balle coûtent 1,10 € en tout. La raquette coûte 1 € de plus que la balle. Combien coûte la balle ?","0,05 € : la raquette coûte 1,05 € et 1,05 + 0,05 = 1,10."],
 ["Avec trois fois le chiffre 5 et des opérations, comment obtenir 30 ?","5 × 5 + 5 = 30."],
 ["Quel est le plus petit nombre entier non nul divisible à la fois par 2, 3, 4, 5 et 6 ?","60."],
 ["Pour numéroter les pages d'un cahier de 1 à 100, combien de fois écrit-on le chiffre 9 ?","20 fois : 10 fois aux unités (9, 19, …, 99) et 10 fois aux dizaines (90 à 99)."],
 ["Mon double augmenté de 7 donne 25. Qui suis-je ?","9 : 2 × 9 + 7 = 25."],
 ["Un rectangle a un périmètre de 20 cm et des côtés entiers. Quelle est la plus grande aire possible ?","25 cm², pour le carré de 5 cm de côté."],
 ["Il est 15 h. Quelle heure sera-t-il dans 100 heures ?","19 h : 100 h = 4 jours et 4 heures."],
 ["Cinq amis se serrent tous la main, une seule fois chacun avec chacun. Combien de poignées de main ?","10 poignées de main : 4 + 3 + 2 + 1."],
 ["Je suis une fraction égale à 1/2. Mon numérateur et mon dénominateur ont pour somme 27. Qui suis-je ?","9/18."],
 ["Le prix d'un jeu augmente de 10 %, puis baisse de 10 %. Revient-il à son prix de départ ?","Non : il vaut 1,1 × 0,9 = 0,99 fois le prix de départ, soit 1 % de moins."],
 ["La somme de trois nombres entiers qui se suivent vaut 48. Quels sont ces nombres ?","15, 16 et 17."],
 ["Une horloge sonne 6 coups en 5 secondes. Combien de temps lui faut-il pour sonner 12 coups ?","11 secondes : 6 coups font 5 intervalles d'une seconde, 12 coups en font 11."],
 ["Je suis un nombre premier compris entre 90 et 100. Qui suis-je ?","97 : 91 = 7 × 13, et les autres sont divisibles par 2, 3 ou 5."],
 ["Quel nombre est exactement au milieu de 2,4 et 2,5 ?","2,45."],
 ["Sur un étang, les nénuphars couvrent chaque jour deux fois plus de surface que la veille. L'étang est couvert le 30e jour. Quel jour était-il à moitié couvert ?","Le 29e jour."],
 ["Combien de nombres entiers de 1 à 100 sont multiples de 3 ou de 5 ?","47 : 33 multiples de 3, plus 20 multiples de 5, moins les 6 multiples de 15 comptés deux fois."],

let T=null; // test en cours
function vueTest(n,c){
 AS.memoriserActif(n.id);
 T={nid:n.id,cid:c.id,titre:c.titre,qs:AS.tirer(c.id),i:0,rep:[],res:null,bonnes:0};
 ouvrir(`<div class="vue c-${n.couleur}">
  <button class="retour a-haut" data-parent="#${n.id}/ascension">${ICO.gauche} Ascension</button>
  <section class="test" id="test"></section></div>`,rendreQuestion,{note:false});
}
function rendreQuestion(){
 const el=document.getElementById('test');if(!el||!T)return;
 const q=T.qs[T.i],L='ABCD';
 const pastilles=T.qs.map((_,k)=>`<i class="${k<T.rep.length?(T.rep[k]?'v':'f'):(k===T.i?'c':'')}"></i>`).join('');
 el.innerHTML=`<div class="t-tete"><span class="eti" style="color:var(--c)">Test · ${esc(T.titre)}</span><span class="doux">Question ${T.i+1} sur ${T.qs.length}</span></div>
  <div class="progres" aria-hidden="true">${pastilles}</div>
  <div class="enonce a-pop">${q.q}</div>
  <div class="reps" role="group" aria-label="Réponses possibles">${q.choix.map((t,k)=>`<button class="rep" type="button" onclick="repondre(${k})"><span class="lettre">${L[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>
  <div class="correction" id="corr" role="status" hidden></div>`;
 window.scrollTo(0,0);
}
function repondre(k){
 if(!T||T.rep.length>T.i)return;
 const q=T.qs[T.i],juste=k===q.bonne,fin=T.i===T.qs.length-1;
 T.rep.push(juste);
 document.querySelectorAll('#test .rep').forEach((b,j)=>{b.disabled=true;if(j===q.bonne)b.classList.add('bonne');else if(j===k)b.classList.add('faux')});
 document.querySelectorAll('#test .progres i')[T.i].className=juste?'v':'f';
 const c=document.getElementById('corr');
 c.innerHTML=`<p class="verdict ${juste?'ok':'non'}"><strong>${juste?'Bien joué !':'Pas tout à fait.'}</strong>${juste?'':' La bonne réponse : <strong>'+esc(q.choix[q.bonne])+'</strong>.'}</p>
  <p class="doux">${esc(q.expl)}</p><button class="btn" type="button" id="suite" onclick="suivante()">${fin?'Voir mon résultat':'Question suivante'} →</button>`;
 c.hidden=false;
 const s=document.getElementById('suite');s.focus({preventScroll:true});s.scrollIntoView({block:'nearest',behavior:REDUIT?'auto':'smooth'});
}
function suivante(){
 if(!T)return;
 T.i++;
 if(T.i<T.qs.length){rendreQuestion();return}
 T.bonnes=T.rep.filter(Boolean).length;
 T.res=AS.enregistrer(T.nid,T.cid,T.bonnes>=CF.SEUIL);
 rendreResultat();
}
function rendreResultat(){
 const el=document.getElementById('test'),r=T.res,n=niveauDe(T.nid),ch=trouverNC(T.cid).c;
 const R=AS.resume(T.nid),rest=CF.T-R.dansPalier;
 const suite=r.palier?` Tu atteins <strong>${r.palier.le}</strong> !`:(R.auSommet?'':` Encore ${rest} test${rest>1?'s réussis':' réussi'} avant ${R.suivant.le}.`);
 const msg={
  'ok':`<strong>+${fr(r.gain)} m</strong>, tu montes à ${fr(r.apres)} m.${suite}`,
  'plafond-atteint':`<strong>+${fr(r.gain)} m</strong>, tu montes à ${fr(r.apres)} m et tu touches le plafond de la semaine. Il remonte à ${fr(AS.plafondApres())} m ${dateLundi()}.${suite}`,
  'plafond':`Test réussi, bravo ! Mais tu es déjà au plafond de la semaine (${fr(r.plafond)} m) : il remonte à ${fr(AS.plafondApres())} m ${dateLundi()}. Rien n’est perdu.`,
  'jour':'Test réussi, bravo ! Ce chapitre t’a déjà fait monter aujourd’hui. Essaie un autre chapitre, ou reviens demain.',
  'sommet':`<strong>+${fr(r.gain)} m</strong> : tu es au sommet du Mont Blanc (${fr(CF.MAX)} m) !`,
  'au-sommet':'Test réussi ! Tu es déjà tout en haut du Mont Blanc : bravo.',
  'echec':`Tu restes à ${fr(r.apres)} m, tu ne redescends pas. Relis ce qui est indiqué ci-dessous, puis réessaie : les questions changent.`
 }[r.raison];
 const vusF={},fautes=[];
 T.qs.forEach((q,k)=>{if(T.rep[k])return;const cle=q.chap+'|'+q.seance;if(vusF[cle])return;vusF[cle]=1;
  const cc=n.chapitres.find(x=>x.id===q.chap),se=cc&&cc.seances&&cc.seances[q.seance-1];if(se)fautes.push({cc,s:q.seance,se})});
 const multi=new Set(fautes.map(f=>f.cc.id)).size>1||(AS.couverts(T.cid).length>1);
 fautes.sort((a,b)=>(a.cc.num-b.cc.num)||(a.s-b.s));
 const revoir=fautes.length?`<section class="a-revoir a-monte"><h3>${r.reussi?'Pour aller plus loin, à relire':'À relire'}</h3><ul>${fautes.map(f=>`<li><a href="#${f.cc.id}">${multi?'Chapitre '+f.cc.num+' · ':''}Séance ${f.s} · ${esc(f.se.titre)}</a></li>`).join('')}</ul></section>`:'';
 el.innerHTML=`<div class="res-test ${r.reussi?'ok':'non'} a-pop"><h2>${r.reussi?'Test réussi !':'Pas cette fois'}</h2>
   <p class="score"><strong>${T.bonnes} / ${T.qs.length}</strong> bonnes réponses${r.reussi?'':' (il en fallait '+CF.SEUIL+')'}</p><p>${msg}</p></div>
  ${r.gain>0?carteScene(T.nid):''}
  ${revoir}
  <div class="choix a-monte"><button class="btn" type="button" onclick="rejouerTest()">Refaire un test</button><a class="btn jaune" href="#${n.id}/ascension">Autres tests</a></div>`;
 window.scrollTo(0,0);
 if(r.gain>0)animerScene(T.nid,r.etAvant,r.etApres);
}
function rejouerTest(){
 if(!T)return;
 T.qs=AS.tirer(T.cid);T.i=0;T.rep=[];T.res=null;T.bonnes=0;
 rendreQuestion();
}

 return `<a class="lien${r.type==='jeu'?' jeu':''}" href="${url(r)}">${ICO[r.type]||ICO.exos}<span class="res"><strong>${esc(r.titre)}</strong><small>${esc(TYPES[r.type]||'')} · ${esc(x.n.nom)} · ${esc(x.c.titre)}</small></span>${estNeuf(r)?NEUF:''}<span class="fl">${ICO.fleche}</span></a>`}
function carteJeu(r,i){return `<a class="carte-jeu a-pop" ${d(i,.2,.05)} href="${url(r)}">
 <span class="ico">${ICO.jeu}</span><span class="t">${esc(r.titre)}</span>${r.resume?`<span class="s">${esc(r.resume)}</span>`:''}${estNeuf(r)?'<span class="gain">Nouveau</span>':''}</a>`}
const nbJeux=c=>c.ressources.filter(r=>r.type==='jeu').length;
const toutes=()=>S.niveaux.flatMap(n=>n.chapitres.flatMap(c=>c.ressources.map(r=>({r,c,n}))));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- pages ---------- */
function accueil(){
 const [q,rep]=enigmeDuJour();
 let der=null;try{der=JSON.parse(localStorage.getItem('mathsLorenzini.derniere')||'null')}catch(e){}
 ouvrir(`<div class="vue">
  <section class="heros a-pop" ${d(0,.05)}>
   <canvas id="mandel" aria-hidden="true"></canvas><button class="rejouer" onclick="rejouerFn&&rejouerFn()">↻ Rejouer</button>
   <div class="txt"><h1>Les maths de M. Lorenzini</h1><p class="doux">Leçons, exercices corrigés et mini-jeux, au même endroit.</p></div>
  </section>
  <section class="vue" style="gap:12px">
   <h2 class="a-monte" ${d(0,.3)}>Je choisis mon niveau</h2>
   <div class="niveaux">
    ${S.niveaux.map((n,i)=>{const j=n.chapitres.reduce((s,c)=>s+nbJeux(c),0);return `<a class="niv c-${n.couleur} a-pop" ${d(i,.38,.08)} href="#${n.id}">
     ${frac(n.id)}<span class="gros">${esc(n.nom)}</span><span class="info">${j} mini-jeux</span></a>`}).join('')}
   </div>
  </section>
  ${der&&der.id?`<a class="reprendre a-monte" ${d(0,.55)} href="pages/${esc(der.id)}/index.html"><span>Reprendre</span><strong>${esc(der.titre)}</strong></a>`:''}
  <section class="recherche a-monte" ${d(0,.6)}>
   <label for="q">Tu cherches quelque chose ?</label>
   <div class="champ">${ICO.loupe}<input id="q" type="search" placeholder="vitesse, fractions, nombres premiers…" autocomplete="off"></div>
   <div id="resultats" class="liens" aria-live="polite"></div>
  </section>
  <section class="enigme a-monte" ${d(0,.7)}>
   <div class="eti">Énigme du jour</div>
   <p class="q">${esc(q)}</p>
   <button class="lien-texte" onclick="this.hidden=true;this.nextElementSibling.hidden=false">Voir la réponse</button>
   <p class="rep" hidden>${esc(rep)}</p>
  </section>
  <section class="archive a-monte" ${d(0,.78)} aria-labelledby="arch-t">
   <h2 id="arch-t" class="eti doux">Les énigmes des jours précédents</h2>
   ${archiveEnigmes().map(e=>`<details class="eg"><summary><span class="ed">${esc(e.date)}</span><span class="eq">${esc(e.q)}</span><span class="er">Voir la réponse</span></summary><p class="ea">${esc(e.rep)}</p></details>`).join('')}
  </section>
  ${blocSauvegarde()}
 </div>`,()=>{
  if(msgSauv){const m=document.getElementById('etat-code');if(m)m.textContent=msgSauv;msgSauv=''}
  lancer('mandel',9500,trMandel);
  const champ=document.getElementById('q'),res=document.getElementById('resultats'),tout=toutes();
  champ.addEventListener('input',()=>{
   const v=norm(champ.value.trim());if(!v){res.innerHTML='';return}
   const mots=v.split(/\s+/);
   const l=tout.filter(x=>{const t=norm([x.r.titre,x.r.resume,x.c.titre,x.c.resume,x.n.nom,TYPES[x.r.type]].join(' '));return mots.every(m=>t.includes(m)||((m==='jeux'||m==='mini-jeux')&&x.r.type==='jeu'))});
   res.innerHTML=l.length?`<p class="doux" style="margin:4px 0">${l.length} page${l.length>1?'s':''} trouvée${l.length>1?'s':''}</p>`+l.map(ligneRes).join(''):'<p class="doux">Aucune page ne correspond. Essaie le nom d’un chapitre.</p>';
  });
 },{pied:piedAscension(AS.actif())});
}

function niveau(n){
 ouvrir(`<div class="vue c-${n.couleur}">
  <button class="retour a-haut" data-parent="#">${ICO.gauche} Accueil</button>
  <section class="bandeau a-pop" ${d(0,.05)}><span class="gros">${esc(n.nom)}</span><span>${esc(n.accroche)}</span><canvas id="fractale" aria-hidden="true"></canvas><button class="rejouer" onclick="rejouerFn&&rejouerFn()">↻ Rejouer</button></section>
  ${onglets(n,'chap')}
  <div class="chapitres">
   ${n.chapitres.map((c,i)=>{const ns=(c.seances||[]).length,nj=nbJeux(c),le=c.ressources.some(r=>r.type==='lecon');
    const dedans=`<span class="haut"><span class="num">${c.num??'★'}</span><span><span class="eti" style="color:var(--c)">${c.num?'Chapitre '+c.num:'Entraînement'}</span><br><span class="t">${esc(c.titre)}</span></span></span>
     ${c.bientot?'<span class="s">Bientôt en ligne</span>':`<span class="puces">${le?`<span class="puce">${ICO.lecon} Leçon</span>`:''}${ns?`<span class="puce">${ICO.exos} ${ns} séance${ns>1?'s':''}</span>`:''}${nj?`<span class="puce jeu">${ICO.jeu} ${nj} mini-jeu${nj>1?'x':''}</span>`:''}</span>`}`;
    return c.bientot?`<div class="chap a-monte" ${d(i,.2,.07)} aria-disabled="true">${dedans}</div>`:`<a class="chap a-monte" ${d(i,.2,.07)} href="#${c.id}">${dedans}</a>`}).join('')}
  </div>
 </div>`,()=>{const F=FRACTALES[n.id]||FRACTALES['6e'];lancer('fractale',F[0],F[1])},{pied:piedAscension(n.id)});
}

function chapitre(n,c){
 const R=c.ressources,lecon=R.find(r=>r.type==='lecon'),jeux=R.filter(r=>r.type==='jeu'),plus=R.filter(r=>r.type==='plus');
 const seances=c.seances||[],utilises=new Set(seances.flatMap(s=>s.ressources||[]));
 const choix=(lecon||jeux.length)?`<div class="choix ${lecon&&jeux.length?'':'seul'} a-monte" ${d(0,.15)}>
   ${lecon?`<a class="btn" href="${url(lecon)}">${ICO.lecon} La leçon</a>`:''}
   ${jeux.length?`<a class="btn jaune" href="#jeux" onclick="event.preventDefault();document.getElementById('jeux').scrollIntoView({behavior:'smooth'})">${ICO.jeu} Les mini-jeux</a>`:''}
  </div>`:'';
 const fiche=seances.some(s=>(s.retenir||[]).length)&&!c.bientot?`<div class="fiche-ligne a-monte" ${d(0,.2)}><button class="btn clair mini" type="button" onclick="imprimerFiche('${n.id}','${c.id}')">${ICO.imprimer} Imprimer la fiche</button><span class="sans-ecran">Pour réviser sans écran</span></div>`:'';
 const blocSeances=seances.map((s,i)=>{
  const res=(s.ressources||[]).map(trouver).filter(Boolean);
  const exos=res.filter(r=>r.type!=='jeu'&&r.type!=='lecon'),sj=res.filter(r=>r.type==='jeu');
  return `<article class="seance a-monte" ${d(i,.25,.08)}>
   <div class="tete"><span class="num">${i+1}</span><div><div class="eti">Séance ${i+1}${s.duree?' · '+esc(s.duree):''}</div><h3>${esc(s.titre)}</h3></div></div>
   <div class="corps">
    ${exos.length?`<div class="etape"><span class="rond">${ICO.exos}</span><div class="cont"><span class="eti">Je refais les exercices</span><div class="liens">${exos.map(lien).join('')}</div></div></div>`:''}
    ${(s.retenir||[]).length?`<div class="etape"><span class="rond">${ICO.retenir}</span><div class="cont"><span class="eti">J’apprends</span><div class="retenir"><ul>${s.retenir.map(t=>`<li>${gras(t)}</li>`).join('')}</ul>${s.exemple?`<p class="ex">Exemple : ${gras(s.exemple)}</p>`:''}${s.savoir?`<p class="savoir"><strong>Je sais</strong> ${gras(s.savoir)}</p>`:''}</div></div></div>`:''}
    ${sj.length?`<div class="etape"><span class="rond">${ICO.jeu}</span><div class="cont"><span class="eti">Je m’entraîne</span><div class="liens">${sj.map(lien).join('')}</div></div></div>`:''}
    ${(s.contenu||[]).length?`<details class="deroule"><summary>Ce qu’on fait en classe</summary><ul>${s.contenu.map(t=>`<li>${gras(t)}</li>`).join('')}</ul></details>`:''}
   </div></article>`}).join('');
 const restant=R.filter(r=>!['jeu','lecon','plus'].includes(r.type)&&!utilises.has(r.id));
 ouvrir(`<div class="vue c-${n.couleur}">
  <button class="retour a-haut" data-parent="#${n.id}">${ICO.gauche} ${esc(n.nom)}</button>
  <section class="bandeau a-pop" ${d(0,.05)}><span class="eti">${esc(n.nom)}${c.num?' · Chapitre '+c.num:''}</span><h2 style="font-size:1.8rem">${esc(c.titre)}</h2>${c.resume?`<span class="doux">${esc(c.resume)}</span>`:''}${frac(n.id).replace('<svg','<svg class="deco"')}</section>
  ${c.bientot?'<div class="enigme"><p class="q">Ce chapitre arrive bientôt.</p><p class="doux">Les pages seront mises en ligne au fil des séances.</p></div>':`
  ${choix}
  ${fiche}
  ${seances.length?`<h2>Les séances</h2>${blocSeances}`:''}
  ${restant.length?`<section class="vue" style="gap:12px"><h2>${seances.length?'Autres ressources du chapitre':'Exercices et activités'}</h2><div class="liens">${restant.map(lien).join('')}</div></section>`:''}
  ${jeux.length?`<section class="vue" style="gap:12px" id="jeux"><h2>Tous les mini-jeux du chapitre</h2><div class="jeux">${jeux.map(carteJeu).join('')}</div></section>`:''}
  ${plus.length?`<section class="vue" style="gap:12px"><h2>Pour s’entraîner encore</h2><div class="liens">${plus.map(lien).join('')}</div></section>`:''}`}
 </div>`,null,{pied:piedAscension(n.id)});
}

/* ---------- navigation par ancre (#6e, #6e-ch3) ---------- */
const pile=[location.hash];
function router(){
 const h=decodeURIComponent(location.hash.replace(/^#/,'')),[a,b,c]=h.split('/'),t=a?trouverNC(a):null;
 if(t&&!t.c&&b==='ascension'&&AS.testables(t.n).length){
  const ch=c&&AS.testables(t.n).find(x=>x.id===c);
  if(ch){vueTest(t.n,ch);document.title='Test · '+ch.titre+' — '+S.titre}
  else{vueAscension(t.n);document.title='Ascension · '+t.n.nom+' — '+S.titre}
 }
 else if(t&&!t.c&&b==='lecon'&&t.n.leconCommune){vueLecon(t.n);document.title='Leçon · '+t.n.nom+' — '+S.titre}
 else if(t&&!t.c&&b==='evaluations'){vueEvaluations(t.n);document.title='Évaluations · '+t.n.nom+' — '+S.titre}
 else if(t&&t.c){chapitre(t.n,t.c);document.title=t.c.titre+' · '+t.n.nom+' — '+S.titre}
 else if(t){niveau(t.n);document.title='Classe de '+t.n.nom+' — '+S.titre}
 else{accueil();document.title=S.titre}
}
addEventListener('hashchange',()=>{document.body.classList.remove('imprime-fiche');const h=location.hash;if(pile.length>1&&pile[pile.length-2]===h)pile.pop();else pile.push(h);fermer();router()});
document.addEventListener('click',e=>{const b=e.target.closest('.retour');if(!b)return;
 const cible=b.getAttribute('data-parent')||'#',nor=x=>String(x||'').replace(/^#/,'');
 /* le bouton va TOUJOURS à sa destination (Accueil, 4e, Ascension…) : on ne revient en arrière que si la page précédente est déjà cette destination */
 if(pile.length>1&&nor(pile[pile.length-2])===nor(cible))history.back();else location.hash=cible});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fermer()});
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>redessiner&&redessiner(),200)});
addEventListener('pageshow',e=>{if(e.persisted){AS.charger();router()}});
router();

</script>
</body>
